  :root.dark {
    --brand: #E2587B; --brand-ink: #EC7C98; --brand-soft: rgba(226,88,123,.14);
    --bg: #121012; --card: #1D1A1C; --field: #262225; --text: #F1ECEE; --hint: #968D92; --line: rgba(255,255,255,.08);
    --ok: #3FBF83; --ok-soft: rgba(63,191,131,.14); --warn: #E3A23B; --warn-soft: rgba(227,162,59,.14); --bad: #EF6B6B; --bad-soft: rgba(239,107,107,.14); --shadow: none;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; color: inherit; }
  .num { font-variant-numeric: tabular-nums; }

  header { position: sticky; top: 0; z-index: 5; background: var(--card); box-shadow: 0 1px 0 var(--line); }
  .bar { padding: 11px 16px 10px; display: flex; align-items: center; gap: 10px; }
  .back { width: 34px; height: 34px; border-radius: 11px; border: 0; background: var(--field); display: grid; place-items: center; cursor: pointer; flex: none; }
  .back svg { width: 18px; height: 18px; }
  .logo { display: flex; align-items: center; gap: 8px; }
  .logo .m { width: 27px; height: 22px; background: var(--brand); -webkit-mask: var(--mark) center/contain no-repeat; mask: var(--mark) center/contain no-repeat; }
  .logo .w { width: 84px; height: 17px; background: var(--brand); -webkit-mask: var(--word) left center/contain no-repeat; mask: var(--word) left center/contain no-repeat; }
  .stepno { margin-left: auto; font-size: 12.5px; font-weight: 700; color: var(--hint); }
  .sample { margin-left: auto; font-size: 11px; font-weight: 700; color: var(--warn); background: var(--warn-soft); padding: 4px 8px; border-radius: 7px; }
  .progress { height: 3px; background: var(--field); } .progress i { display: block; height: 100%; background: var(--brand); transition: width .25s; }

  main { padding: 18px 16px calc(110px + env(safe-area-inset-bottom)); max-width: 640px; margin: 0 auto; }
  h1 { font-size: 23px; margin: 0 0 4px; letter-spacing: -.3px; text-wrap: balance; }
  .sub { color: var(--hint); font-size: 14px; margin: 0 0 16px; }
  .chosen { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: var(--brand); background: var(--brand-soft); padding: 5px 10px; border-radius: 999px; margin-bottom: 10px; }

  .opts { display: grid; gap: 8px; }
  .opts.two { grid-template-columns: 1fr 1fr; }
  .opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--card); border: 1.5px solid transparent; border-radius: 14px;
    padding: 15px 14px; font-size: 15.5px; font-weight: 600; cursor: pointer; box-shadow: var(--shadow); }
  .opt .r { margin-left: auto; color: var(--hint); font-size: 13px; font-weight: 500; }
  .opt.on { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); }
  .opt .box { width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--line); flex: none; display: grid; place-items: center; }
  .opt.on .box { background: var(--brand); border-color: var(--brand); color: #fff; }
  .opt .box svg { width: 14px; height: 14px; visibility: hidden; }
  .opt.on .box svg { visibility: visible; }
  .opt.center { justify-content: center; text-align: center; padding: 18px 10px; font-size: 16px; }

  .search { position: relative; margin-bottom: 12px; }
  .search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--hint); }
  .search input { width: 100%; padding: 13px 14px 13px 40px; border-radius: 13px; border: 1.5px solid transparent; background: var(--card);
    color: var(--text); font-size: 16px; outline: none; -webkit-appearance: none; box-shadow: var(--shadow); }
  .search input:focus { border-color: var(--brand); }

/* Mintaqa va batareya chegirmalari model seriyasiga qarab: Excel'dagi "Qaysi modellar" ustuni
   ("16, 17, Air") — shu seriyalarga; bo'sh qatorlar — qolgan barcha modellarga. */
const seriesOf = m => { const s = String(m || '').toLowerCase(); const n = s.match(/\b(\d{1,2})(?:e)?\b/); return n ? n[1] : (/\bair\b/.test(s) ? 'air' : ''); };
function forModel(list){
  const s = seriesOf(S.model);
  const spec = (list || []).filter(r => r.models && s && r.models.split(',').includes(s));
  return spec.length ? spec : (list || []).filter(r => !r.models);
}

const batteries = () => forModel(D.battery);
/* Trade-in bonusi: Excel "Trade-in" varag'i (seriya bo'yicha); varaq bo'lmasa — umumiy foiz */
const tradeBonus = () => (D.tradein && D.tradein.length) ? ((forModel(D.tradein)[0] || {}).pct || 0) : (D.tradein_bonus || 0);
const maxTradeBonus = () => (D.tradein && D.tradein.length) ? Math.max(0, ...D.tradein.map(x => x.pct || 0)) : (D.tradein_bonus || 0);
const entry = () => D.models.find(m => m.brand === S.brand && m.model === S.model && m.memory === S.mem);
function batteryTier(p){ const B = batteries(); if (p === '' || isNaN(p)) return null; return B.find(b => p >= b.from && p <= b.to) || B[B.length - 1] || null; }
function unknownTier(){ const B = batteries(); return B.find(b => /normal/i.test(b.label)) || B.find(b => 80 >= b.from && 80 <= b.to) || B[Math.min(2, B.length - 1)] || null; }

/* ---------- telefon rasmi (SVG, oddiy chizma — brend rasmi emas) ---------- */
function shade(hex, f){
  const m = /^#?([0-9a-f]{6})$/i.exec(hex || ''); if (!m) return '#8E8E93';
  const n = parseInt(m[1], 16); let r = n >> 16 & 255, g = n >> 8 & 255, b = n & 255; const t = f < 0 ? 0 : 255, p = Math.abs(f);
  r = Math.round((t - r) * p + r); g = Math.round((t - g) * p + g); b = Math.round((t - b) * p + b);
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
}
function phoneKind(brand, model){
  const b = String(brand || '').toLowerCase(), m = String(model || '');
  if (b === 'apple') { const n = +((m.match(/\d+/) || [0])[0]);
    const cam = /Air/.test(m) ? 'air' : /Pro/.test(m) ? 'tri' : /\b1[67]\b/.test(m) ? 'dualv' : 'duald';
    return { cam, top: (/Air/.test(m) || n >= 15 || (n === 14 && /Pro/.test(m))) ? 'island' : 'notch' }; }
  if (b === 'samsung') return { cam: /Ultra/.test(m) ? 'ultra' : 'sam3', top: 'hole' };
  return { cam: 'square', top: 'hole' };
}
// kamera bloki: [hudud (rect), linzalar, markaz]
function camGeom(cam){
  switch (cam) {
    case 'tri':   return { box: [7, 7, 42, 42, 11], lens: [[18.5, 18.5, 7.6], [18.5, 37.5, 7.6], [37.5, 28, 7.6]], flash: [38, 14], c: [28, 28] };
    case 'duald': return { box: [7, 7, 36, 36, 10], lens: [[17.5, 17.5, 7], [32.5, 32.5, 7]], flash: [33, 15], c: [25, 25] };
    case 'dualv': return { box: [9, 8, 20, 40, 10], lens: [[19, 18, 7], [19, 38, 7]], flash: [33, 13], c: [19, 28] };
    case 'air':   return { box: [5, 7, 90, 20, 10], lens: [[17, 17, 6.5]], flash: [30, 17], c: [50, 17] };
    case 'sam3':  return { box: [9, 7, 19, 53, 9], lens: [[18.5, 16.5, 6.5], [18.5, 33.5, 6.5], [18.5, 50.5, 6.5]], flash: [32, 16], c: [18.5, 33], bare: 1 };
    case 'ultra': return { box: [9, 7, 36, 53, 9], lens: [[18.5, 16.5, 6.5], [18.5, 33.5, 6.5], [18.5, 50.5, 6.5], [35, 22, 5.5]], flash: [35, 38], c: [24, 33], bare: 1 };
    default:      return { box: [7, 7, 40, 40, 12], lens: [[18, 18, 6.8], [36, 18, 6.8], [18, 36, 6.8], [36, 36, 6.8]], flash: [27, 27], c: [27, 27] };
  }
}

    <linearGradient id="${id}g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".12"/></linearGradient>

    const tf = mk.faceid ? '#BB2548' : '#000';

    else s += `<circle cx="50" cy="15" r="3.3" fill="${tf}"/>`;
    s += `<rect x="30" y="198.3" width="12" height="1.4" rx=".7" fill="${mk.speaker ? '#BB2548' : '#000'}" opacity=".7"/>`;
    s += `<rect x="58" y="198.3" width="12" height="1.4" rx=".7" fill="${mk.speaker ? '#BB2548' : '#000'}" opacity=".7"/>`;
  } else {
    s += `<rect x="2" y="2" width="96" height="196" rx="15.5" fill="${col}"/>`;
    s += `<rect x="2" y="2" width="96" height="196" rx="15.5" fill="url(#${id}g)"/>`;
    if (mk.back) s += `<rect x="2" y="2" width="96" height="196" rx="15.5" fill="${HL}" stroke="#BB2548" stroke-width="1.4"/>`;
    if (o.battery) s += `<rect x="20" y="62" width="60" height="92" rx="7" fill="${mk.battery ? HL : 'none'}" stroke="${mk.battery ? '#BB2548' : '#000'}" stroke-opacity="${mk.battery ? 1 : .28}" stroke-width="1.4" stroke-dasharray="4 3"/>`;
    const g = camGeom(k.cam);
    if (!g.bare) { const [x, y, w, h, r] = g.box;
      s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${shade(col, -0.1)}" stroke="${shade(col, -0.25)}" stroke-width=".8"/>`; }
    g.lens.forEach(([x, y, r]) => { s += `<circle cx="${x}" cy="${y}" r="${r}" fill="${shade(col, -0.35)}"/><circle cx="${x}" cy="${y}" r="${r * 0.72}" fill="#15171C"/><circle cx="${x - r * .25}" cy="${y - r * .25}" r="${r * 0.18}" fill="#fff" opacity=".35"/>`; });
    s += `<circle cx="${g.flash[0]}" cy="${g.flash[1]}" r="2.3" fill="#F3EFE6"/>`;

  return s + '</svg>';
}

function vParts(s){

  const sel = () => S.ans[s.qi] || [];
  const toggle = i => { let cur = sel();
    if (i === 0) cur = cur.includes(0) ? [] : [0];
    else { cur = cur.filter(x => x !== 0); cur = cur.includes(i) ? cur.filter(x => x !== i) : [...cur, i]; }

  const mark = {}; sel().forEach(i => { const o = q.options[i]; if (o && o.pos) mark[o.pos] = true; });
  const shortL = l => l.replace(/\s*\/.*$/, '').replace(/ skaneri$/, '').replace(/^Разъём зарядки$/, 'Разъём');
  const pins = q.options.map((o, i) => o.pos ? { key: String(i), code: o.pos, label: shortL(tx(o, 'label')), on: sel().includes(i), sym: '✓' } : null).filter(Boolean);

/* ---------- steps (dynamic) ---------- */
function steps(){
  if (S.flow === 'new') return [{ k: 'brand' }];
  const st = [{ k: 'brand' }, { k: 'model' }];
  if (S.model && memsOf(S.brand, S.model).length > 1) st.push({ k: 'mem' });
  if (S.model && colorsOf(S.brand, S.model).length) st.push({ k: 'color' });
  if (S.brand && regionsOf(S.brand).length) st.push({ k: 'region' });
  if (D.battery.length) st.push({ k: 'battery' });
  if ((D.damage || []).length) st.push({ k: 'damage' });
  D.questions.forEach((q, qi) => st.push({ k: 'q', qi }));
  st.push({ k: S.flow === 'listing' ? 'listing' : 'result' });
  return st;
}

/* ---------- pricing ---------- */
function calc(){
  const e = entry(); if (!e) return null;
  const lines = []; let pct = 0, blocked = false;
  const add = (label, p) => { if (p > 0) { pct += p; lines.push({ label, p }); } };
  const ce = colorEntry(); if (ce) add(`${t('Rang')}: ${tx(ce, 'name')}`, ce.pct);
  // model o'zgargan bo'lsa ham — tanlangan region kodi shu modelga tegishli foiz bilan olinadi
  const reg = S.region ? (regionsOf(S.brand).find(r => r.code === S.region.code) || S.region) : null;
  if (reg) add(`${t('Mintaqa')}: ${tx(reg, 'label')}`, reg.pct);
  const bt = S.batteryUnknown ? unknownTier() : batteryTier(+S.battery);
  if (bt) add(`${t('Batareya')}: ${S.batteryUnknown ? t("noma'lum") : S.battery + '%'} (${tx(bt, 'label')})`, bt.pct);
  (D.damage || []).forEach(z => { const l = z.levels[S.dmg[z.code] || 0]; if (!l || !(S.dmg[z.code] > 0)) return;
    if (l.block) blocked = true; add(`${tx(z, 'name')}: ${tx(l, 'label')}`, l.pct); });
  D.questions.forEach((q, qi) => (S.ans[qi] || []).forEach(oi => { const o = q.options[oi]; if (!o) return;
    if (o.block) blocked = true; add(`${tx(q, 'title').replace(/\?$/, '')}: ${tx(o, 'label')}`, o.pct); }));
  pct = Math.min(pct, D.max_pct);
  const r = D.round_to || 1;
  const cash = Math.max(0, Math.round(e.base * (1 - pct / 100) / r) * r);
  const tb = tradeBonus();
  const trade = Math.round(cash * (1 + tb / 100) / r) * r;
  return { base: e.base, pct, cash, trade, tb, blocked, lines: lines.map(l => ({ ...l, sum: Math.round(e.base * l.p / 100 / 1000) * 1000 })) };
}

  const st = steps(); if (S.i >= st.length) S.i = st.length - 1;
  const s = st[S.i], total = st.length - 1;
  document.getElementById('bar').innerHTML = S.i === 0
    ? `<div class="logo"><span class="m"></span><span class="w"></span></div>${D.sample ? `<span class="sample">${t('Namuna narxlar')}</span>` : ''}<span class="langs"><button data-lang="uz" class="${LANG === 'uz' ? 'on' : ''}">UZ</button><button data-lang="ru" class="${LANG === 'ru' ? 'on' : ''}">RU</button></span>`
    : `<button class="back" id="backBtn" aria-label="${t('Orqaga')}">${I.back}</button><div class="logo"><span class="m"></span><span class="w"></span></div>
       <span class="stepno">${s.k === 'result' ? t('Natija') : s.k === 'listing' ? t("E'lon berish") : `${S.i + 1} / ${total}`}</span>`;
  document.getElementById('prog').style.width = (s.k === 'result' || s.k === 'listing' ? 100 : total ? (S.i / total) * 100 : 0) + '%';
  if (s.k === 'result') track('result', '', `${S.brand} ${S.model} ${S.mem}`.trim());
  else track('step', s.k === 'q' ? 'q:' + String((D.questions[s.qi] || {}).title || '').slice(0, 28) : s.k);
  const V = { brand: vBrand, model: vModel, mem: vMem, color: vColor, damage: vDamage, region: vRegion, battery: vBattery, q: vQuestion, result: vResult, listing: vListing }[s.k];
  const out = V(s);
  document.getElementById('view').innerHTML = out.html;
  const foot = document.getElementById('foot');
  foot.hidden = !out.foot; document.getElementById('footIn').innerHTML = out.foot || '';
  if (document.getElementById('backBtn')) document.getElementById('backBtn').onclick = back;
  document.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => { if (b.dataset.lang !== LANG) setLang(b.dataset.lang); });

}

function nasiyaCalc(price, down, months){
  const row = (D.nasiya || []).find(x => x.months === months); if (!row) return null;
  // 1-variant: ustama (+20$) dan oldingi asl narxdan boshlang'ich to'lov ayiriladi, qoldiqqa oylik foiz qo'yiladi,
  // keyin bir martalik ustama (+20$) qo'shiladi.  Masalan: (1809−20−800)×1.27+20 = 1276 → 6 oyga 213$

  const listing = { kind: 'listing', lang: LANG, src: SRC, brand: S.brand, model: S.model, memory: S.mem, color: S.color,
    region: S.region ? S.region.label : '', battery: S.batteryUnknown ? '' : (S.battery ? S.battery + '%' : ''),

    show_tg: S.L.showtg, name: S.name.trim(), phone: S.phone.trim(), est_cash: r.cash, photos: S.photos.slice(0, 3) };
  const go = () => {
    sending = true; const btn = $('lsend'); if (btn) { btn.disabled = true; btn.textContent = t('Yuborilmoqda…'); }
    const ctl = window.AbortController ? new AbortController() : null; const timer = setTimeout(() => ctl && ctl.abort(), 90000);
    fetch(D.api.replace(/\/$/, '') + '/api/listing', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ initData: tg.initData, listing }), signal: ctl ? ctl.signal : undefined })
      .then(res => res.json().catch(() => ({})).then(j => ({ ok: res.ok && j.ok, err: j.error || res.status })))
      .then(({ ok, err }) => {
        if (ok) { haptic('success');
          const sh = openSheet(`<div style="text-align:center;padding:6px 0 2px"><div style="font-size:46px;line-height:1">📢</div>

            <div style="height:8px"></div><button class="btn ghost" id="l-again">${t("Yana e'lon berish")}</button>`);
          sh.querySelector('#l-close').onclick = () => { try { tg.close(); } catch (e) { closeSheet(); } };
          sh.querySelector('#l-again').onclick = () => { closeSheet(); restart(); };

              : err === 'auth' ? t('Sahifa eskirib qoldi. Ilovani yopib, qayta oching.') : t("Arizani yuborib bo'lmadi. Internetni tekshirib, qayta urinib ko'ring."));
          if (btn) { btn.disabled = false; btn.textContent = t("E'lonni yuborish"); }
        } })
      .catch(() => { haptic('error'); toast(t("Arizani yuborib bo'lmadi. Internetni tekshirib, qayta urinib ko'ring."));
        const b2 = $('lsend'); if (b2) { b2.disabled = false; b2.textContent = t("E'lonni yuborish"); } })
      .finally(() => { clearTimeout(timer); sending = false; });
  };

  try { if (tg.requestWriteAccess && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9')) { tg.requestWriteAccess(() => go()); return; } } catch (e) {}
  go();
}

const _banPick = {};
function bannerFor(place){
  const d = new Date(), today = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  let list = (D.banners || []).filter(b => (b.place === place || b.place === 'both') && (!b.from || b.from <= today) && (!b.to || b.to >= today));
  // trade-in bonusi yo'q model uchun natijada trade-in reklamasini ko'rsatmaymiz
  if (place === 'result' && S.model && !tradeBonus()) list = list.filter(b => !/trade.?in|трейд/i.test(`${b.title} ${b.text} ${b.title_ru || ''}`));
  if (!list.length) return null;
  if (_banPick[place] == null) _banPick[place] = Math.floor(Math.random() * list.length);   // bir sessiyada bitta, navbat bilan
  return list[_banPick[place] % list.length];
}

function brOpenNow(b){ const n = new Date(), m = n.getHours() * 60 + n.getMinutes(); const p = x => { const [h, mi] = String(x).split(':').map(Number); return h * 60 + (mi || 0); };

function dayDate(i){ const d = new Date(); d.setDate(d.getDate() + i); return d; }
function slotsFor(br, day){
  const [oh] = String((br && br.open) || (branches()[0] || {}).open || '09:00').split(':').map(Number);
  const [ch] = String((br && br.close) || (branches()[0] || {}).close || '20:00').split(':').map(Number);

  if (day !== 0) return out;
  const now = new Date(), hNow = now.getHours() + now.getMinutes() / 60;

const canPhotos = () => !!(tg && tg.initData && D.api);
function shrinkImage(file){
  return new Promise((res, rej) => { const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { const M = 1280, k = Math.min(1, M / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.8)); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(); }; img.src = url; });
}

  if (!canPhotos()) return '';
  return `<div class="visit-sub">${t('Telefon rasmlari')} <i>(${S.flow === 'listing' && S.i === steps().length - 1 ? t('1–3 ta, majburiy') : t('ixtiyoriy, 3 tagacha')})</i></div>

    <div class="phs">${S.photos.map((p, i) => `<div class="tile"><img src="${p}" alt=""><button data-rm="${i}" aria-label="×">×</button></div>`).join('')}
      ${S.photos.length < 3 ? `<button class="add" id="phAdd"><span><b>+</b>${t("Rasm qo'shish")}</span></button>` : ''}</div>
    <input type="file" id="phFile" accept="image/*" multiple hidden>`;
}

  const inp = box.querySelector('#phFile'), add = box.querySelector('#phAdd');

  if (inp) inp.onchange = async () => {
    for (const f of Array.from(inp.files || []).slice(0, 3 - S.photos.length)) {
      try { S.photos.push(await shrinkImage(f)); } catch (e) { toast(t("Rasmni o'qib bo'lmadi")); }
    }
    haptic(); redraw(); };
  box.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { S.photos.splice(+b.dataset.rm, 1); haptic(); redraw(); });
}

function getLocation(cb){
  let done = false; const fin = (l, e) => { if (!done) { done = true; cb(l, e); } };
  const viaBrowser = () => {
    if (!navigator.geolocation) return fin(null, t("Joylashuvni aniqlab bo'lmadi — manzilni yozing"));
    navigator.geolocation.getCurrentPosition(p => fin({ lat: +p.coords.latitude.toFixed(6), lon: +p.coords.longitude.toFixed(6) }),
      e => fin(null, e && e.code === 1 ? t("Joylashuvga ruxsat berilmadi — manzilni yozing") : t("Joylashuvni aniqlab bo'lmadi — manzilni yozing")),
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
  };
  const lm = tg && tg.LocationManager;
  if (lm && typeof lm.init === 'function') {
    try {
      const go = () => {
        if (!lm.isLocationAvailable) return viaBrowser();
        lm.getLocation(d => { if (d && d.latitude) fin({ lat: +(+d.latitude).toFixed(6), lon: +(+d.longitude).toFixed(6) });
          else if (lm.isAccessRequested && !lm.isAccessGranted) { try { lm.openSettings(); } catch (e) {} fin(null, t("Telegram sozlamalarida joylashuvga ruxsat bering")); }
          else viaBrowser(); });
      };
      lm.isInited ? go() : lm.init(go);
      setTimeout(() => { if (!done) viaBrowser(); }, 8000);
      return;
    } catch (e) { /* eski Telegram — brauzer usuli */ }
  }
  viaBrowser();
}
function openLead(mode){
  S.mode = mode; const r = calc(); track('lead_open', mode);
  if (!inTelegram) {   // Instagram yoki oddiy brauzer: ariza Telegram ichida yuboriladi
    const bot = (D.bot || '').replace(/^@/, ''), app = (D.app || '').replace(/^\//, '');
    const link = bot ? (app ? `https://t.me/${encodeURIComponent(bot)}/${encodeURIComponent(app)}` : `https://t.me/${encodeURIComponent(bot)}?start=narx`) : '';
    openSheet(`<h3>${t('Arizani Telegram orqali yuboring')}</h3>
      <p>${t('Narxingiz')}: ${esc(S.brand)} ${esc(S.model)} · ${esc(S.mem)}${r && !r.blocked ? ` — ${t('naqd')} ${som(r.cash)}${r.tb ? `, trade-in ${som(r.trade)}` : ''}` : ''}.</p>
      <p>${app ? t("Telegram'da shu ilova ochiladi — javoblarni yana bir bor belgilab, arizani yuboring.")
               : t("Telegram'da botimiz ochiladi: <b>Start</b> ni bosing, so'ng <b>📱 Telefonni narxlash</b> tugmasi orqali arizani yuboring.")}</p>
      <div style="height:14px"></div>
      ${link ? `<a class="btn" style="text-decoration:none;display:block;text-align:center" href="${link}" target="_blank" rel="noopener">${t("Telegram'da davom etish")}</a>` : ''}`);
    return;
  }
  const title = t({ tradein: 'Trade-in arizasi', cash: 'Hoziroq Markabga sotish', check: "Ko'rikka yozilish" }[mode]);
  const price = mode === 'tradein' ? r.trade : mode === 'cash' ? r.cash : 0;
  const sh = openSheet(`<h3>${title}</h3>
    <p>${esc(S.brand)} ${esc(S.model)} · ${esc(S.mem)}${price ? ` · ${t('taxminan')} ${som(price)}` : ''}</p>
    <div class="seg pk-seg"><button data-pk="0" class="${!S.pickup ? 'on' : ''}">🏬 ${t('Filialga boraman')}</button><button data-pk="1" class="${S.pickup ? 'on' : ''}">🚗 ${t('Kuryer olib ketsin')}</button></div>
    <p id="pkNote">${S.pickup ? t("Bepul, Toshkent shahri bo'ylab. Kuryer telefonni joyida tekshiradi va pulni o'sha zahoti beradi.") : t("Xodimimiz qo'ng'iroq qilib, filialga kelish vaqtini kelishadi.")}</p>
    <label for="l-name">${t('Ismingiz')}</label><input class="f" id="l-name" autocomplete="name" value="${esc(S.name)}">
    <label for="l-phone">${t('Telefon raqamingiz')}</label><input class="f num" id="l-phone" inputmode="tel" value="${esc(S.phone || '+998 ')}" placeholder="+998 90 123 45 67">
    <div id="pkAddr" style="${S.pickup ? '' : 'display:none'}"><label for="l-addr">${t('Manzil (Toshkent)')}</label>
      <input class="f" id="l-addr" autocomplete="street-address" placeholder="${t("Masalan: Chilonzor 9-kvartal, 12-uy")}" value="${esc(S.addr || '')}">
      <button type="button" class="loc-btn ${S.loc ? 'ok' : ''}" id="l-loc">${S.loc ? '✅ ' + t('Joylashuv qo\'shildi') : '📍 ' + t('Joylashuvimni yuborish')}</button></div>
    <div id="visit">${visitHTML()}</div>
    <div id="photos">${photosHTML()}</div>
    <div style="height:14px"></div><button class="btn" id="l-send">${t('Yuborish')}</button>`);
  const n = sh.querySelector('#l-name'), p = sh.querySelector('#l-phone');
  bindVisit(sh.querySelector('#visit')); bindPhotos(sh.querySelector('#photos'));
  const ad = sh.querySelector('#l-addr'); ad.oninput = e => { S.addr = e.target.value; ad.classList.remove('bad'); };
  const lb = sh.querySelector('#l-loc');
  lb.onclick = () => { lb.textContent = '⏳ ' + t('Joylashuv aniqlanmoqda…'); getLocation((loc, err) => {
    if (loc) { S.loc = loc; lb.classList.add('ok'); lb.textContent = '✅ ' + t("Joylashuv qo'shildi"); ad.classList.remove('bad'); haptic('success'); }
    else { lb.textContent = '📍 ' + t('Joylashuvimni yuborish'); toast(err || t("Joylashuvni aniqlab bo'lmadi — manzilni yozing")); } }); };
  sh.querySelectorAll('[data-pk]').forEach(b => b.onclick = () => {
    S.pickup = b.dataset.pk === '1'; haptic();
    sh.querySelectorAll('[data-pk]').forEach(x => x.classList.toggle('on', x === b));
    sh.querySelector('#pkAddr').style.display = S.pickup ? '' : 'none';
    sh.querySelector('#pkNote').textContent = S.pickup ? t("Bepul, Toshkent shahri bo'ylab. Kuryer telefonni joyida tekshiradi va pulni o'sha zahoti beradi.") : t("Xodimimiz qo'ng'iroq qilib, filialga kelish vaqtini kelishadi.");
    const vb = sh.querySelector('#visit'); vb.innerHTML = visitHTML(); bindVisit(vb); });
  n.oninput = e => { S.name = e.target.value; n.classList.remove('bad'); };
  p.oninput = e => { S.phone = maskPhone(e.target.value); e.target.value = S.phone; if (phoneOk(S.phone)) p.classList.remove('bad'); };
  sh.querySelector('#l-send').onclick = () => {
    const bad = { n: !S.name.trim(), p: !phoneOk(S.phone), a: !!S.pickup && !S.loc && (S.addr || '').trim().length < 5 };
    n.classList.toggle('bad', bad.n); p.classList.toggle('bad', bad.p); ad.classList.toggle('bad', bad.a);
    if (bad.n || bad.p) { haptic('error'); toast(t("Ism va telefon raqamini to'liq kiriting")); return; }
    if (bad.a) { haptic('error'); toast(t('Kuryer uchun manzilni yozing yoki joylashuvni yuboring')); return; }
    sendLead();
  };
}

function buildAnswers(){   // xodimlar uchun — doim o'zbekcha
  const answers = D.questions.map((q, qi) => ({ q: q.title, a: (S.ans[qi] || []).map(i => q.options[i] && q.options[i].label).filter(Boolean).join(', '),
    pct: (S.ans[qi] || []).reduce((s, i) => s + ((q.options[i] || {}).pct || 0), 0) }));
  const dmgAns = (D.damage || []).map(z => { const l = z.levels[S.dmg[z.code] || 0] || {}; return { q: z.name, a: l.label || '', pct: (S.dmg[z.code] > 0 && l.pct) || 0 }; });
  return [...dmgAns, ...answers];
}
function sendLead(){
  const r = calc();
  const answers = buildAnswers();
  const payload = { lang: LANG, src: SRC, kind: 'tradein', v: 2, mode: S.mode, name: S.name.trim(), phone: S.phone.trim(),
    brand: S.brand, model: S.model, memory: S.mem, color: S.color, region: S.region ? S.region.label : '',
    battery: S.batteryUnknown ? "noma'lum" : (S.battery ? S.battery + '%' : ''), answers,
    blocked: r.blocked, cash: r.blocked ? 0 : r.cash, trade: r.blocked ? 0 : (r.tb ? r.trade : null), base: r.base,
    branch: S.pickup ? '' : (curBranch() ? curBranch().name : (S.branch === -1 ? "Farqi yo'q" : '')), visit: visitText(),
    pickup: !!S.pickup, address: S.pickup ? (S.addr || '').trim().slice(0, 200) : '',
    lat: S.pickup && S.loc ? S.loc.lat : null, lon: S.pickup && S.loc ? S.loc.lon : null,
    feedback: S.feedback, competitor: +String(S.competitor).replace(/\D/g, '') || 0 };
  // 1) Havola orqali ochilgan (t.me/<bot>/narx): initData bor -> arizani serverimizga yuboramiz
  if (inTelegram && tg.initData && D.api) { if (S.photos.length) payload.photos = S.photos.slice(0, 3); postLead(payload); return; }
  // 2) Botdagi pastki tugma orqali ochilgan: Telegram o'zi botga yetkazadi
  if (inTelegram && tg.sendData) {
    try { tg.sendData(JSON.stringify(payload)); haptic('success'); }
    catch (e) { haptic('error'); toast(t("Yuborish uchun botdagi pastki «📱 Telefonni narxlash» tugmasi orqali oching (/narx)")); }
  } else {
    closeSheet(); toast(t('Brauzerda ochilgan: ariza faqat Telegram ichida yuboriladi.'));
    console.log('TRADEIN', payload);
  }
}

let sending = false;
function postLead(payload){
  if (sending) return; sending = true;
  const btn = document.getElementById('l-send') || document.getElementById('l-retry');
  if (btn) { btn.disabled = true; btn.textContent = t('Yuborilmoqda…'); }
  const ctl = window.AbortController ? new AbortController() : null;
  const timer = setTimeout(() => ctl && ctl.abort(), payload.photos ? 90000 : 20000);
  fetch(D.api.replace(/\/$/, '') + '/api/lead', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ initData: tg.initData, lead: payload }), signal: ctl ? ctl.signal : undefined })
    .then(res => res.json().catch(() => ({})).then(j => ({ ok: res.ok && j.ok, err: j.error || res.status })))
    .then(({ ok, err }) => { if (ok) leadDone(); else leadFail(err); })
    .catch(() => leadFail('net'))
    .finally(() => { clearTimeout(timer); sending = false; });
}
function leadDone(){
  haptic('success');
  const sh = openSheet(`<div style="text-align:center;padding:6px 0 2px">
      <div style="font-size:46px;line-height:1">✅</div>
      <h3 style="margin-top:10px">${t('Arizangiz qabul qilindi!')}</h3>
      <p>${t("Xodimimiz {p} raqamiga tez orada qo'ng'iroq qiladi.", { p: `<b>${esc(S.phone)}</b>` })}</p>
      ${curBranch() ? `<div class="place"><b>📍 ${t('Sizni kutamiz')}: ${esc(tx(curBranch(), 'name'))}${S.day >= 0 && S.day != null ? ' · ' + esc(t(['Bugun', 'Ertaga', 'Indinga'][S.day])) + (S.slot ? ', ' + S.slot : '') : ''}</b>
        ${esc(tx(curBranch(), 'addr'))}${curBranch().map ? `<div style="margin-top:6px"><a href="${esc(curBranch().map)}" target="_blank" rel="noopener" style="color:var(--brand);font-weight:700">${t('Xaritada ochish')} →</a></div>` : ''}</div>` : ''}</div>
    <div style="height:10px"></div>
    <button class="btn" id="l-close">${t('Yopish')}</button>
    <div style="height:8px"></div><button class="btn ghost" id="l-again">${t('Boshqa telefonni baholash')}</button>`);
  sh.querySelector('#l-close').onclick = () => { try { tg.close(); } catch (e) { closeSheet(); } };
  sh.querySelector('#l-again').onclick = () => { closeSheet(); S.photos = []; restart(); };
}
function leadFail(err){
  haptic('error');
  const msg = t(err === 'rate' ? "Juda ko'p ariza yuborildi. Birozdan so'ng qayta urinib ko'ring."
            : err === 'auth' ? "Sahifa eskirib qoldi. Ilovani yopib, qayta oching."
            : "Arizani yuborib bo'lmadi. Internetni tekshirib, qayta urinib ko'ring.");
  const bot = (D.bot || '').replace(/^@/, '');
  const sh = openSheet(`<h3>${t('Yuborilmadi')}</h3><p>${msg}</p><div style="height:14px"></div>
    <button class="btn" id="l-retry">${t('Qayta yuborish')}</button>
    ${bot ? `<div style="height:8px"></div><a class="btn ghost" style="text-decoration:none;display:block;text-align:center" href="https://t.me/${encodeURIComponent(bot)}?start=narx">${t('Bot orqali yuborish')}</a>` : ''}`);
  sh.querySelector('#l-retry').onclick = () => sendLead();
}

track('open');
render();
</script>
