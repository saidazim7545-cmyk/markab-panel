  :root.dark {
    --brand: #E2587B; --brand-ink: #EC7C98; --brand-soft: rgba(226,88,123,.14); --on-brand: #fff;
    --bg: #121012; --card: #1D1A1C; --field: #262225; --text: #F1ECEE; --hint: #968D92; --line: rgba(255,255,255,.08);
    --ok: #3FBF83; --ok-soft: rgba(63,191,131,.14); --warn: #E3A23B; --warn-soft: rgba(227,162,59,.14);
    --bad: #EF6B6B; --bad-soft: rgba(239,107,107,.14);
    --shadow: none;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; color: inherit; }
  .num { font-variant-numeric: tabular-nums; }

  /* header */
  header { position: sticky; top: 0; z-index: 5; background: var(--card); box-shadow: 0 1px 0 var(--line);
    padding: 11px 16px; display: flex; align-items: center; justify-content: space-between; }
  .logo { display: flex; align-items: center; gap: 8px; }
  .logo .m { width: 27px; height: 22px; background: var(--brand); -webkit-mask: var(--mark) center/contain no-repeat; mask: var(--mark) center/contain no-repeat; }
  .logo .w { width: 84px; height: 17px; background: var(--brand); -webkit-mask: var(--word) left center/contain no-repeat; mask: var(--word) left center/contain no-repeat; }
  .logo small { font-size: 11px; font-weight: 600; color: var(--hint); text-transform: uppercase; letter-spacing: .6px;
    border-left: 1px solid var(--line); padding-left: 8px; margin-left: 2px; }
  .lang { display: flex; background: var(--field); border-radius: 9px; padding: 2px; }
  .lang button { border: 0; background: none; color: var(--hint); padding: 5px 10px; font-weight: 700; font-size: 12px; border-radius: 7px; cursor: pointer; }
  .lang button.on { background: var(--card); color: var(--brand); box-shadow: 0 1px 2px rgba(0,0,0,.08); }

  main { padding: 14px 16px calc(92px + env(safe-area-inset-bottom)); max-width: 720px; margin: 0 auto; }

  /* nav */
  nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 5; background: var(--card); box-shadow: 0 -1px 0 var(--line);
    display: grid; grid-template-columns: repeat(4, 1fr); padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); }
  nav button { border: 0; background: none; color: var(--hint); padding: 2px 2px 4px; font-size: 11px; font-weight: 600; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px; }
  nav button i { display: grid; place-items: center; width: 52px; height: 30px; border-radius: 15px; transition: background .15s; }
  nav button svg { width: 22px; height: 22px; }
  nav button.on { color: var(--brand); }
  nav button.on i { background: var(--brand-soft); }

  /* catalog */
  .search { position: relative; }
  .search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--hint); pointer-events: none; }
  .search input { width: 100%; padding: 12px 14px 12px 40px; border-radius: 12px; border: 1px solid transparent; background: var(--card);
    color: var(--text); font-size: 15px; outline: none; box-shadow: var(--shadow); -webkit-appearance: none; }
  .search input:focus { border-color: var(--brand); }
  .chips { display: flex; gap: 7px; overflow-x: auto; padding: 12px 16px 2px; margin: 0 -16px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 999px;
    padding: 7px 13px; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; }
  .chip.on { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }
  .meta { color: var(--hint); font-size: 12px; margin: 12px 2px 8px; display: flex; justify-content: space-between; gap: 8px; }

/* ---------- phone mask: +998 90 123 45 67 ---------- */
function maskPhone(v){
  let d = String(v).replace(/\D/g, '');
  if (d.startsWith('998')) d = d.slice(3);
  d = d.slice(0, 9);
  const p = [d.slice(0,2), d.slice(2,5), d.slice(5,7), d.slice(7,9)].filter(Boolean);
  return '+998' + (p.length ? ' ' + p.join(' ') : ' ');
}
const phoneOk = v => String(v).replace(/\D/g,'').replace(/^998/,'').length === 9;

/* ---------- nasiya ---------- */
const types = () => [...new Set(DATA.nasiya.map(r => r.type))];
const termsFor = type => DATA.nasiya.filter(r => r.type === type).sort((a,b) => a.months - b.months);
function nasiyaCalc(price, type, months, downPct){
  const rule = DATA.nasiya.find(r => r.type === type && r.months === months);
  const down = price * downPct / 100;
  const financed = Math.max(price - down, 0);
  const markupPct = rule ? rule.markup : 0;
  const total = financed * (1 + markupPct / 100);
  return { down, financed, markupPct, markupSum: total - financed, total,
           monthly: months ? total / months : 0, minDown: rule ? (rule.min_down || 0) : 0 };
}
function fixCalcState(c){
  const tp = types();
  if (!tp.includes(c.type)) c.type = tp[0] || '';
  const terms = termsFor(c.type);
  if (!terms.find(r => r.months === c.term)) c.term = terms.length ? terms[0].months : 0;
  return terms;
}

/* ---------- branches: open now? (Tashkent time) ---------- */
function openNow(hours){
  const m = String(hours || '').match(/(\d{1,2})[:.](\d{2})\s*[–-]\s*(\d{1,2})[:.](\d{2})/); if (!m) return null;
  const now = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Tashkent' }));
  const cur = now.getHours() * 60 + now.getMinutes(), a = +m[1]*60 + +m[2], b = +m[3]*60 + +m[4];
  return b > a ? (cur >= a && cur < b) : (cur >= a || cur < b);
}

  pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  map: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/></svg>',
  send: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/></svg>',
};

/* ---------- render ---------- */
function render(){
  document.documentElement.lang = S.lang;
  document.getElementById('t-title').textContent = t('title');
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.l === S.lang));
  document.getElementById('nav').innerHTML = ['catalog','calc','order','branches'].map(k =>
    `<button data-tab="${k}" class="${S.tab===k?'on':''}"><i>${I[k]}</i><span>${t(k)}</span></button>`).join('');
  document.getElementById('view').innerHTML =
    ({ catalog: viewCatalog, calc: viewCalc, order: viewOrder, branches: viewBranches }[S.tab])();
  bindView();
}

function stockInfo(p){
  const n = p.stock_total || 0, br = Object.values(p.stock || {}), have = br.filter(x => x > 0).length;
  const cls = n <= 0 ? 'no' : n <= 3 ? 'low' : 'ok';
  const label = n <= 0 ? t('none') : `${n <= 3 ? t('low') : t('inStock')}: ${n} ${t('pcs')}`;
  return { cls, label, where: br.length && n > 0 ? `· ${have}/${br.length} ${t('inBranches')}` : '' };
}
function filtered(){
  const q = S.q.trim().toLowerCase();
  return DATA.products.filter(p => (!S.cat || p.category === S.cat) &&
    (!q || [p.name, p.brand, p.model, p.sku].join(' ').toLowerCase().includes(q)));
}
function productRows(list){
  return list.length ? list.map(p => { const s = stockInfo(p); return `
      <div class="item" data-sku="${esc(p.sku)}">
        <div class="top"><div class="name">${esc(p.name)}</div><div class="price num">${fmt(p.price)}</div></div>
        <div class="sub">${esc(p.brand)}${p.model ? ' · ' + esc(p.model) : ''}</div>
        <div class="stock ${s.cls}"><span class="dot"></span>${s.label}<span class="where">${s.where}</span></div>
      </div>`; }).join('') : `<div class="empty">${t('noResults')}</div>`;
}
function metaLine(n){ return `<span>${n} ${t('found')}</span>${DATA.updated ? `<span>${t('updated')}: ${esc(DATA.updated)}</span>` : ''}`; }
function viewCatalog(){
  const cats = [...new Set(DATA.products.map(p => p.category))];
  const list = filtered();
  return `
    ${DATA.sample ? `<div class="sample">● ${t('sample')}</div>` : ''}
    <div class="search">${I.search}<input id="q" type="search" placeholder="${t('search')}" value="${esc(S.q)}" autocomplete="off"></div>
    <div class="chips">
      <button class="chip ${!S.cat?'on':''}" data-cat="">${t('all')}</button>
      ${cats.map(c => `<button class="chip ${S.cat===c?'on':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}
    </div>
    <div class="meta" id="pmeta">${metaLine(list.length)}</div>
    <div class="list" id="plist">${productRows(list)}</div>`;
}

function pickerBtn(id, sku, bad){
  const p = product(sku);
  return `<button class="picker ${bad?'bad':''}" id="${id}">${p
    ? `<span><div class="pn">${esc(p.name)}</div><div class="pp num">${fmt(p.price)}</div></span>`
    : `<span class="ph">${t('pick')}</span>`}${I.chev}</button>`;
}
function termSeg(id, type, cur){
  const terms = termsFor(type);
  return terms.length ? `<div class="seg" id="${id}">${terms.map(x =>
    `<button data-v="${x.months}" class="${cur===x.months?'on':''}">${x.months} ${t('months')}</button>`).join('')}</div>`
    : `<div class="note">${t('noTerm')}</div>`;
}

function viewCalc(){
  const c = S.calc; fixCalcState(c);
  return `
  <div class="card"><h2>${t('calcTitle')}</h2><p class="lead">${t('calcLead')}</p>
    <div class="lbl">${t('product')}</div>${pickerBtn('c-product', c.product)}
    <label>${t('price')}</label>
    <input id="c-price" class="num" inputmode="numeric" value="${c.price ? num(c.price) : ''}" placeholder="0">
    <div class="lbl">${t('type')}</div>
    <div class="seg" id="c-type">${types().map(x => `<button data-v="${esc(x)}" class="${c.type===x?'on':''}">${esc(x)}</button>`).join('')}</div>
    <div class="lbl">${t('term')}</div>${termSeg('c-term', c.type, c.term)}
    <div class="lbl">${t('down')}</div>
    <div class="range-row"><input type="range" id="c-down" min="0" max="90" step="5" value="${c.down}" style="--p:${c.down/90*100}%"><b id="c-down-v" class="num">${c.down}%</b></div>
    <div id="c-res">${calcResult()}</div>
  </div>`;
}
function calcResult(){
  const c = S.calc;
  if (!c.price) return `<div class="empty-calc">${I.calc}${t('emptyCalc')}</div>`;
  const r = nasiyaCalc(c.price, c.type, c.term, c.down);
  const warn = r.minDown && c.down < r.minDown ? `<div class="note warn">${t('minDown')}: ${r.minDown}%</div>` : '';
  return `
    <div class="hero"><div class="k">${t('monthly')}</div>
      <div class="v num">${fmt(r.monthly)} <small>× ${c.term} ${t('months')}</small></div></div>
    <div class="rows">
      <div class="row"><span>${t('down')} (${c.down}%)</span><b class="num">${fmt(r.down)}</b></div>
      <div class="row"><span>${t('financed')}</span><b class="num">${fmt(r.financed)}</b></div>
      <div class="row"><span>${t('markup')} (${r.markupPct}%)</span><b class="num">${fmt(r.markupSum)}</b></div>
      <div class="row"><span>${t('total')}</span><b class="num">${fmt(r.total + r.down)}</b></div>
    </div>${warn}
    <div class="btn-row"><button class="btn ghost" id="c-copy">${I.copy}${t('copy')}</button><button class="btn" id="c-order">${t('toOrder')}</button></div>`;
}
function calcText(){
  const c = S.calc, r = nasiyaCalc(c.price, c.type, c.term, c.down), p = product(c.product);
  return [ 'Markab Electronics', p ? p.name : '', `${t('price')}: ${fmt(c.price)}`,
    `${t('type')}: ${c.type}, ${c.term} ${t('months')}`, `${t('down')}: ${fmt(r.down)} (${c.down}%)`,
    `${t('monthly')}: ${fmt(r.monthly)}`, `${t('total')}: ${fmt(r.total + r.down)}` ].filter(Boolean).join('\n');
}
async function copyText(s){
  try { await navigator.clipboard.writeText(s); return true; } catch(e){}
  try { const ta = document.createElement('textarea'); ta.value = s; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select(); const ok = document.execCommand('copy'); ta.remove(); return ok; } catch(e){ return false; }
}

function viewOrder(){
  const o = S.order, E = S.errors, isN = o.pay === 'nasiya';
  fixCalcState(o);
  const p = product(o.product);
  let inline = '';
  if (isN && p && o.term) { const r = nasiyaCalc(p.price, o.type, o.term, o.down);
    inline = `<div class="inline-calc"><span>${t('monthly')}</span><b class="num">${fmt(r.monthly)}</b></div>`; }
  return `
  <div class="card"><h2>${t('orderTitle')}</h2><p class="lead">${t('orderLead')}</p>
    <label>${t('client')} *</label><input id="o-client" class="${E.client?'bad':''}" value="${esc(o.client)}" autocomplete="off">
    <label>${t('phone')} *</label><input id="o-phone" class="num ${E.phone?'bad':''}" inputmode="tel" value="${esc(o.phone || '+998 ')}" placeholder="+998 90 123 45 67">
    <div class="lbl">${t('product')} *</div>${pickerBtn('o-product', o.product, E.product)}
    <div class="lbl">${t('pay')}</div>
    <div class="seg" id="o-pay"><button data-v="cash" class="${!isN?'on':''}">${t('cash')}</button><button data-v="nasiya" class="${isN?'on':''}">${t('nasiya')}</button></div>
    <div class="lbl">${t('type')}</div>
    <div class="seg" id="o-type">${types().map(x => `<button data-v="${esc(x)}" class="${o.type===x?'on':''}">${esc(x)}</button>`).join('')}</div>
    ${isN ? `
      <div class="lbl">${t('term')}</div>${termSeg('o-term', o.type, o.term)}
      <div class="lbl">${t('down')}</div>
      <div class="range-row"><input type="range" id="o-down" min="0" max="90" step="5" value="${o.down}" style="--p:${o.down/90*100}%"><b id="o-down-v" class="num">${o.down}%</b></div>
      <div id="o-inline">${inline}</div>` : ''}
    ${DATA.branches.length ? `<div class="lbl">${t('branch')}</div>
      <div class="seg wrap" id="o-branch">${DATA.branches.map(b => `<button data-v="${esc(b.name)}" class="${o.branch===b.name?'on':''}">${esc(b.name)}</button>`).join('')}</div>` : ''}
    <label>${t('comment')}</label><textarea id="o-comment" rows="2" placeholder="${t('commentPh')}">${esc(o.comment)}</textarea>
    <button class="btn" id="o-review">${t('review')}</button>
  </div>`;
}
const contractLabel = o => `${o.pay === 'nasiya' ? 'Nasiya' : 'Naqd'} ${o.type}`.trim();

function viewBranches(){
  return DATA.branches.map(b => {
    const st = openNow(b.hours), tel = String(b.phone || '').replace(/[^\d+]/g, '');
    return `
    <div class="card branch">
      <div class="head"><div class="name">${esc(b.name)}</div>
        ${st === null ? '' : `<span class="badge ${st?'open':'closed'}">${st ? t('open') : t('closed')}</span>`}</div>
      <div class="line">${I.pin}${b.address ? `<span>${esc(b.address)}</span>` : `<span class="muted">${t('noAddress')}</span>`}</div>
      ${b.hours ? `<div class="line">${I.clock}<span class="num">${esc(b.hours)}</span></div>` : ''}
      <div class="acts">
        <a class="act ${tel?'':'off'}" ${tel ? `href="tel:${esc(tel)}"` : ''}>${I.phone}${t('call')}</a>
        <a class="act ${b.map?'':'off'}" ${b.map ? `href="${esc(b.map)}" data-ext="1" target="_blank"` : ''}>${I.map}${t('map')}</a>
      </div>
    </div>`; }).join('') || `<div class="empty">—</div>`;
}

/* ---------- sheets ---------- */
function openSheet(html){ const sh = document.getElementById('sheet'); sh.innerHTML = '<div class="grab"></div>' + html; sh.scrollTop = 0;
  document.getElementById('sheetBg').classList.add('open'); sh.classList.add('open'); return sh; }
function closeSheet(){ document.getElementById('sheet').classList.remove('open'); document.getElementById('sheetBg').classList.remove('open'); }
document.getElementById('sheetBg').onclick = closeSheet;

function openProduct(sku){
  const p = product(sku); if (!p) return;
  const stocks = Object.entries(p.stock || {}).map(([b,n]) => { const c = n <= 0 ? 'no' : n <= 2 ? 'low' : 'ok';
    return `<div class="stockrow"><span>${esc(b)}</span><span class="pill ${c} num">${n} ${t('pcs')}</span></div>`; }).join('');
  openSheet(`<h3>${esc(p.name)}</h3><div class="sub">${esc(p.brand)}${p.model ? ' · ' + esc(p.model) : ''} · SKU ${esc(p.sku)}</div>
    <div class="bigprice num">${fmt(p.price)}</div>
    ${p.note ? `<div class="note">${esc(p.note)}</div>` : ''}
    ${stocks ? `<div class="section-t">${t('stockBy')}</div>${stocks}` : ''}
    <div class="btn-row"><button class="btn ghost" id="s-calc">${t('calcIt')}</button><button class="btn" id="s-order">${t('toOrder')}</button></div>`);
  document.getElementById('s-calc').onclick = () => { closeSheet(); Object.assign(S.calc, { product: sku, price: p.price }); go('calc'); };
  document.getElementById('s-order').onclick = () => { closeSheet(); S.order.product = sku; go('order'); };
}

function openPicker(current, onPick){
  const sh = openSheet(`<h3>${t('pickTitle')}</h3>
    <div class="search" style="margin-top:12px">${I.search}<input id="pk-q" type="search" placeholder="${t('search')}" autocomplete="off" style="background:var(--field);box-shadow:none"></div>
    <div class="plist" id="pk-list"></div>`);
  const draw = q => { q = q.trim().toLowerCase();
    const list = DATA.products.filter(p => !q || [p.name, p.brand, p.model, p.sku].join(' ').toLowerCase().includes(q));
    sh.querySelector('#pk-list').innerHTML = list.map(p => { const s = stockInfo(p); return `
      <div class="popt ${p.sku===current?'sel':''}" data-pk="${esc(p.sku)}"><div><div class="n">${esc(p.name)}</div>
        <div class="s">${esc(p.brand)} · <span style="color:var(--${s.cls==='ok'?'ok':s.cls==='low'?'warn':'bad'})">${s.label}</span></div></div>
        <div class="p num">${fmt(p.price)}</div></div>`; }).join('') || `<div class="empty">${t('noResults')}</div>`;
    sh.querySelectorAll('[data-pk]').forEach(el => el.onclick = () => { haptic(); closeSheet(); onPick(el.dataset.pk); }); };
  draw('');
  sh.querySelector('#pk-q').oninput = e => draw(e.target.value);
}

function openConfirm(){
  const o = S.order, p = product(o.product), isN = o.pay === 'nasiya';
  const r = isN ? nasiyaCalc(p.price, o.type, o.term, o.down) : null;
  const row = (k, v) => v ? `<div class="row"><span>${k}</span><b>${v}</b></div>` : '';
  openSheet(`<h3>${t('confirmTitle')}</h3>
    <div class="rows">
      ${row(t('client'), esc(o.client.trim()))}${row(t('phone'), esc(o.phone))}
      ${row(t('product'), esc(p.name))}${row(t('price'), fmt(p.price))}
      ${row(t('type'), esc(contractLabel(o)))}
      ${isN ? row(t('term'), `${o.term} ${t('months')}`) + row(t('down'), `${fmt(r.down)} (${o.down}%)`) + row(t('monthly'), fmt(r.monthly)) : ''}
      ${row(t('branch'), esc(o.branch))}${row(t('comment'), esc(o.comment.trim()))}
    </div>
    <div class="btn-row"><button class="btn ghost" id="cf-edit">${t('edit')}</button><button class="btn" id="cf-send">${I.send}${t('send')}</button></div>`);
  document.getElementById('cf-edit').onclick = closeSheet;
  document.getElementById('cf-send').onclick = () => { closeSheet(); sendOrder(); };
}

/* ---------- events ---------- */
function go(tab){ S.tab = tab; S.errors = {}; render(); window.scrollTo(0,0); }
function bindView(){
  const $ = id => document.getElementById(id);
  const segs = (sel, fn) => document.querySelectorAll(sel + ' button').forEach(b => b.onclick = () => { haptic(); fn(b.dataset.v); });
  if (S.tab === 'catalog') {
    const bindItems = () => document.querySelectorAll('[data-sku]').forEach(el => el.onclick = () => openProduct(el.dataset.sku));
    $('q').oninput = e => { S.q = e.target.value; const list = filtered();
      $('plist').innerHTML = productRows(list); $('pmeta').innerHTML = metaLine(list.length); bindItems(); };
    document.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => { S.cat = b.dataset.cat; haptic(); render(); });
    bindItems();
  }
  if (S.tab === 'calc') {
    const c = S.calc;
    const refresh = () => { $('c-res').innerHTML = calcResult(); bindCalcRes(); };
    const bindCalcRes = () => {
      if ($('c-copy')) $('c-copy').onclick = async () => { haptic('success'); toast(await copyText(calcText()) ? t('copied') : calcText()); };
      if ($('c-order')) $('c-order').onclick = () => { Object.assign(S.order, { product: c.product, pay: 'nasiya', type: c.type, term: c.term, down: c.down }); go('order'); };
    };
    $('c-product').onclick = () => openPicker(c.product, sku => { c.product = sku; c.price = product(sku).price; render(); });
    $('c-price').oninput = e => { const n = +e.target.value.replace(/\D/g,''); c.price = n;
      if (c.product) { c.product = ''; $('c-product').outerHTML = pickerBtn('c-product', ''); $('c-product').onclick = () => openPicker('', sku => { c.product = sku; c.price = product(sku).price; render(); }); }
      e.target.value = n ? num(n) : ''; refresh(); };
    segs('#c-type', v => { c.type = v; render(); });
    segs('#c-term', v => { c.term = +v; render(); });
    $('c-down').oninput = e => { c.down = +e.target.value; e.target.style.setProperty('--p', c.down/90*100+'%'); $('c-down-v').textContent = c.down + '%'; refresh(); };
    bindCalcRes();
  }
  if (S.tab === 'order') {
    const o = S.order;
    $('o-client').oninput = e => { o.client = e.target.value; S.errors.client = false; e.target.classList.remove('bad'); };
    $('o-phone').oninput = e => { o.phone = maskPhone(e.target.value); e.target.value = o.phone; if (phoneOk(o.phone)) { S.errors.phone = false; e.target.classList.remove('bad'); } };
    $('o-phone').onfocus = e => { if (!o.phone) { o.phone = '+998 '; e.target.value = o.phone; } };
    $('o-comment').oninput = e => o.comment = e.target.value;
    $('o-product').onclick = () => openPicker(o.product, sku => { o.product = sku; S.errors.product = false; render(); });
    segs('#o-pay', v => { o.pay = v; render(); });
    segs('#o-type', v => { o.type = v; render(); });
    segs('#o-term', v => { o.term = +v; render(); });
    segs('#o-branch', v => { o.branch = o.branch === v ? '' : v; render(); });
    if ($('o-down')) $('o-down').oninput = e => { o.down = +e.target.value; e.target.style.setProperty('--p', o.down/90*100+'%'); $('o-down-v').textContent = o.down + '%';
      const p = product(o.product); if (p && o.term) { const r = nasiyaCalc(p.price, o.type, o.term, o.down);
        $('o-inline').innerHTML = `<div class="inline-calc"><span>${t('monthly')}</span><b class="num">${fmt(r.monthly)}</b></div>`; } };
    $('o-review').onclick = () => {
      S.errors = { client: !o.client.trim(), phone: !phoneOk(o.phone), product: !product(o.product) };
      if (Object.values(S.errors).some(Boolean)) { haptic('error'); render(); toast(t('required')); return; }
      openConfirm();
    };
  }
  document.querySelectorAll('[data-ext]').forEach(a => a.onclick = e => {
    if (inTelegram && tg.openLink) { e.preventDefault(); tg.openLink(a.href); } });
}

function sendOrder(){
  const o = S.order, p = product(o.product), isN = o.pay === 'nasiya';
  const payload = { kind: 'order', client: o.client.trim(), phone: o.phone.trim(),
    product: p.name, sku: p.sku, price: p.price, type: contractLabel(o),
    term: isN ? o.term : '', down: isN ? o.down : '', branch: o.branch, comment: o.comment.trim() };
  if (isN && o.term) { const r = nasiyaCalc(p.price, o.type, o.term, o.down); if (r.monthly) payload.monthly = Math.round(r.monthly); }
  if (inTelegram && tg.sendData) {
    try {
      tg.sendData(JSON.stringify(payload));   // bot web_app_data sifatida oladi; oyna yopiladi
      haptic('success');
    } catch (e) {
      // Menyu tugmasi orqali ochilganda Telegram sendData'ga ruxsat bermaydi
      haptic('error'); toast(t('useButton'));
    }
  } else {
    toast(t('preview'));
    console.log('ORDER', payload);
  }
}

document.getElementById('nav').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]'); if (!b) return; haptic(); go(b.dataset.tab);
});
document.querySelectorAll('.lang button').forEach(b => b.onclick = () => { S.lang = b.dataset.l; localSet('lang', S.lang); render(); });

render();
</script>
</body>
</html>
