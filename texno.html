  :root.dark {
    --brand: #E8E8EA; --brand-ink: #FFFFFF; --brand-soft: rgba(232,232,234,.12); --on-brand: #111113;
    --bg: #121012; --card: #1D1A1C; --field: #262225; --text: #F1ECEE; --hint: #968D92; --line: rgba(255,255,255,.08);
    --ok: #3FBF83; --ok-soft: rgba(63,191,131,.14); --warn: #E3A23B; --warn-soft: rgba(227,162,59,.14); --bad: #EF6B6B; --bad-soft: rgba(239,107,107,.14); --shadow: none;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif; }
  body { background: transparent; }
  button { font: inherit; color: inherit; }
  .num { font-variant-numeric: tabular-nums; }

  header { position: sticky; top: 0; z-index: 5; background: var(--card); box-shadow: 0 1px 0 var(--line); }
  .bar { padding: 11px 16px 10px; display: flex; align-items: center; gap: 10px; }
  .back { width: 34px; height: 34px; border-radius: 11px; border: 0; background: var(--field); display: grid; place-items: center; cursor: pointer; flex: none; }
  .back svg { width: 18px; height: 18px; }
  .logo { display: flex; align-items: center; gap: 8px; }
  .logo .m { width: 32px; height: 28px; background: var(--brand); -webkit-mask: var(--mark) center/contain no-repeat; mask: var(--mark) center/contain no-repeat; }
  .logo .w { width: 66px; height: 28px; background: var(--brand); -webkit-mask: var(--word) left center/contain no-repeat; mask: var(--word) left center/contain no-repeat; }
  .stepno { margin-left: auto; font-size: 12.5px; font-weight: 700; color: var(--hint); }
  .sample { margin-left: auto; font-size: 11px; font-weight: 700; color: var(--warn); background: var(--warn-soft); padding: 4px 8px; border-radius: 7px; }
  .progress { height: 3px; background: var(--field); } .progress i { display: block; height: 100%; background: var(--brand); transition: width .25s; }

  main { padding: 18px 16px calc(110px + env(safe-area-inset-bottom)); max-width: 640px; margin: 0 auto; }
  h1 { font-size: 23px; margin: 0 0 4px; letter-spacing: -.3px; text-wrap: balance; }
  .sub { color: var(--hint); font-size: 14px; margin: 0 0 16px; }
  .chosen { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; color: var(--brand); background: var(--brand-soft); padding: 5px 10px; border-radius: 999px; margin-bottom: 10px; }

  .opts { display: grid; gap: 8px; }
  .opts.two { grid-template-columns: 1fr 1fr; }
  .opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--card); border: 1.5px solid transparent; border-radius: 14px;
    padding: 15px 14px; font-size: 15.5px; font-weight: 600; cursor: pointer; box-shadow: var(--shadow); }
  .opt .r { margin-left: auto; color: var(--hint); font-size: 13px; font-weight: 500; }
  .opt.on { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); }
  .opt .box { width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--line); flex: none; display: grid; place-items: center; }
  .opt.on .box { background: var(--brand); border-color: var(--brand); color: #fff; }
  .opt .box svg { width: 14px; height: 14px; visibility: hidden; }
  .opt.on .box svg { visibility: visible; }
  .opt.center { justify-content: center; text-align: center; padding: 18px 10px; font-size: 16px; }

  .search { position: relative; margin-bottom: 12px; }
  .search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--hint); }
  .search input { width: 100%; padding: 13px 14px 13px 40px; border-radius: 13px; border: 1.5px solid transparent; background: var(--card);
    color: var(--text); font-size: 16px; outline: none; -webkit-appearance: none; box-shadow: var(--shadow); }
  .search input:focus { border-color: var(--brand); }

  .hint { display: flex; gap: 10px; background: var(--card); border-radius: 14px; padding: 12px 14px; margin-bottom: 14px; font-size: 13.5px; box-shadow: var(--shadow); }
  .hint svg { width: 20px; height: 20px; flex: none; color: var(--brand); margin-top: 1px; }
  .hint b { display: block; margin-bottom: 2px; }
  .bat { background: var(--card); border-radius: 18px; padding: 20px 16px; text-align: center; box-shadow: var(--shadow); }
  .bat input { width: 150px; text-align: center; font-size: 44px; font-weight: 800; border: 0; border-bottom: 2px solid var(--line); background: none; color: var(--text); outline: none; padding: 4px 0; -webkit-appearance: none; }
  .bat input:focus { border-color: var(--brand); }
  .bat .pc { font-size: 30px; font-weight: 800; color: var(--hint); }
  .bat .st { margin-top: 12px; display: inline-block; font-size: 13px; font-weight: 700; padding: 5px 12px; border-radius: 999px; background: var(--field); color: var(--hint); }
  .bat .st.good { background: var(--ok-soft); color: var(--ok); } .bat .st.mid { background: var(--warn-soft); color: var(--warn); } .bat .st.low { background: var(--bad-soft); color: var(--bad); }
  .linkbtn { background: none; border: 0; color: var(--brand); font-weight: 700; font-size: 14px; margin-top: 14px; cursor: pointer; padding: 6px; }

  .colors { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .col { display: flex; align-items: center; gap: 10px; text-align: left; border: 1.5px solid transparent; background: var(--card); border-radius: 14px; padding: 12px; cursor: pointer; font-size: 14px; font-weight: 700; color: var(--text); box-shadow: var(--shadow); line-height: 1.25; }
  .col.on { border-color: var(--brand); background: var(--brand-soft); }
  .col i { width: 30px; height: 30px; flex: none; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.14), 0 1px 3px rgba(0,0,0,.12); }
  .col small { display: block; font-weight: 500; font-size: 12px; color: var(--hint); }
  /* telefon rasmi */
  .phones { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: var(--card); border-radius: 18px; padding: 14px 8px 10px; box-shadow: var(--shadow); margin-bottom: 12px; }
  .pv { position: relative; }
  .pv svg { display: block; width: 100%; height: auto; }
  .cap { text-align: center; font-size: 12px; font-weight: 700; color: var(--hint); margin-top: 4px; }
  .pin { position: absolute; transform: translate(-50%, -50%); border: 1.5px solid var(--brand); background: var(--card); color: var(--text);
    border-radius: 999px; padding: 4px 8px 4px 6px; font-size: 11px; font-weight: 800; line-height: 1.1; cursor: pointer; white-space: nowrap;
    max-width: 96px; overflow: hidden; text-overflow: ellipsis; box-shadow: 0 2px 8px rgba(0,0,0,.18); display: inline-flex; align-items: center; gap: 3px; }
  .pin b { display: inline-grid; place-items: center; width: 15px; height: 15px; border-radius: 50%; background: var(--brand); color: #fff; font-size: 11px; flex: none; }
  .pin.on { background: var(--brand); color: #fff; } .pin.on b { background: #fff; color: var(--brand); }
  .zl { display: grid; gap: 8px; }
  .zrow { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: var(--card); border: 1.5px solid transparent; border-radius: 14px; padding: 13px 14px; cursor: pointer; font-size: 15px; font-weight: 700; color: var(--text); box-shadow: var(--shadow); }
  .zrow .r { margin-left: auto; font-size: 13px; font-weight: 700; color: var(--ok); }
  .zrow.on { border-color: var(--brand); background: var(--brand-soft); } .zrow.on .r { color: var(--brand); }
  .zrow svg { width: 18px; height: 18px; color: var(--hint); flex: none; }
  .colors.ph { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
  .col.ph { flex-direction: column; text-align: center; gap: 6px; padding: 12px 8px 10px; }
  .col.ph svg, .col.ph img { width: 56px; height: 104px; object-fit: contain; }
  .col.ph span { font-size: 13px; }
  .sample + .langs { margin-left: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1.5px solid transparent; background: var(--field); color: var(--text); border-radius: 11px; padding: 9px 12px; font-size: 14px; font-weight: 700; cursor: pointer; }
  .chip.on { border-color: var(--brand); background: var(--brand-soft); color: var(--brand); }
  .chip small { display: block; font-size: 11px; font-weight: 600; color: var(--hint); margin-top: 1px; }
  .chip.on small { color: var(--brand); }
  .visit-sub { font-size: 12.5px; font-weight: 700; color: var(--hint); margin: 12px 0 6px; }
  .visit-sub i { font-style: normal; font-weight: 500; }
  .place { background: var(--field); border-radius: 12px; padding: 11px 12px; font-size: 13.5px; text-align: left; margin-top: 10px; }
  .place b { display: block; margin-bottom: 2px; }
  .phs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .phs .tile { position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: var(--field); }
  .phs .tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .phs .tile button { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 50%; border: 0; background: rgba(0,0,0,.6); color: #fff; font-size: 15px; line-height: 24px; cursor: pointer; }
  .phs .add { aspect-ratio: 1; border-radius: 12px; border: 1.5px dashed var(--line); background: var(--field); color: var(--brand); font-weight: 800; font-size: 12.5px; cursor: pointer; display: grid; place-items: center; text-align: center; padding: 6px; }
  .phs .add b { display: block; font-size: 24px; line-height: 1; }
  .ph-hint { font-size: 12px; color: var(--hint); margin: -2px 0 8px; }
  .seg.three { grid-template-columns: 1fr 1fr 1fr; } .seg.three button { font-size: 12.5px; line-height: 1.25; padding: 9px 4px; }
  .np-rate { font-size: 12.5px; color: var(--hint); margin: -4px 0 12px; }
  .np-rate b { color: var(--text); }
  .np-models { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin: 0 -2px 12px; scrollbar-width: none; }
  .np-models::-webkit-scrollbar { display: none; }
  .np-models .chip { white-space: nowrap; flex: none; }
  .np-sim { margin-bottom: 12px; }
  .np-card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 4px 14px; margin-bottom: 12px; }
  .np-card h3 { margin: 10px 0 4px; font-size: 15px; }
  .np-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
  .np-card h3 + .np-row { border-top: 0; }
  .np-dot { width: 18px; height: 18px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
  .np-row .nm { flex: 1; font-size: 14px; font-weight: 600; }
  .np-row .pr { text-align: right; font-weight: 800; font-size: 15px; }
  .np-row .pr small { display: block; font-size: 12px; font-weight: 600; color: var(--hint); }
  .np-row { cursor: pointer; } .np-row:active { opacity: .7; }
  .np-row .ns { display: block; font-size: 11.5px; font-weight: 700; color: var(--brand); margin-top: 2px; }
  .np-hint { background: var(--field); border-radius: 12px; padding: 10px 12px; font-size: 13px; margin: 0 0 12px; }
  .ns-phone { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 14px; display: flex; gap: 12px; align-items: center; }
  .ns-phone .np-dot { width: 28px; height: 28px; }
  .ns-phone b { display: block; font-size: 15px; } .ns-phone span { font-size: 13px; color: var(--hint); }

  const m = /^#?([0-9a-f]{6})$/i.exec(hex || ''); if (!m) return '#8E8E93';

  return '#' + ((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1);
}
function phoneKind(brand, model){

    return { cam, top: (/Air/.test(m) || n >= 15 || (n === 14 && /Pro/.test(m))) ? 'island' : 'notch' }; }

    case 'sam3':  return { box: [9, 7, 19, 53, 9], lens: [[18.5, 16.5, 6.5], [18.5, 33.5, 6.5], [18.5, 50.5, 6.5]], flash: [32, 16], c: [18.5, 33], bare: 1 };

  if (S.model && colorsOf(S.brand, S.model).length) st.push({ k: 'color' });
  if (S.brand && regionsOf(S.brand).length) st.push({ k: 'region' });

  if (reg) add(`${t('Mintaqa')}: ${tx(reg, 'label')}`, reg.pct);
  const bt = S.batteryUnknown ? unknownTier() : batteryTier(+S.battery);
  if (bt) add(`${t('Batareya')}: ${S.batteryUnknown ? t("noma'lum") : S.battery + '%'} (${tx(bt, 'label')})`, bt.pct);
  (D.damage || []).forEach(z => { const l = z.levels[S.dmg[z.code] || 0]; if (!l || !(S.dmg[z.code] > 0)) return;
    if (l.block) blocked = true;
    const broken = (S.dmg[z.code] || 0) === z.levels.length - 1;            // eng og'ir daraja: yoriq/singan, urilgan/egilgan
    if (broken && pu && rate) addFix(`${tx(z, 'name')}: ${tx(l, 'label')}`, z.code === 'screen' ? pu.screen : pu.other);
    else add(`${tx(z, 'name')}: ${tx(l, 'label')}`, l.pct); });
  D.questions.forEach((q, qi) => (S.ans[qi] || []).forEach(oi => { const o = q.options[oi]; if (!o) return;
    if (o.block) blocked = true;
    const lbl = `${tx(q, 'title').replace(/\?$/, '')}: ${tx(o, 'label')}`;
    if (isReplQ(q) && oi > 0 && pu && rate) addFix(lbl, o.pos === 'screen' ? pu.screen : pu.other);
    else if (isBoxQ(q) && oi > 0 && pu && pu.box > 0 && rate) addFix(lbl, pu.box);         // asl qutisi yo'q
    else add(lbl, o.pct); }));
  pct = Math.min(pct, D.max_pct);
  const r = D.round_to || 1;
  // foizli chegirmalar + qat'iy $ summalar; jami a'lo narxning max_pct (70%) idan oshmaydi
  const ded = Math.min(e.base * pct / 100 + fix, e.base * D.max_pct / 100);
  pct = e.base ? ded * 100 / e.base : 0;
  const cash = Math.max(0, Math.round((e.base - ded) / r) * r);
  const tb = tradeBonus();
  const trade = Math.round(cash * (1 + tb / 100) / r) * r;
  return { base: e.base, pct, cash, trade, tb, blocked, lines: lines.map(l => ({ ...l, sum: l.fix || Math.round(e.base * l.p / 100 / 1000) * 1000 })) };
}

const fmtSum = n => Math.round(n).toLocaleString('ru-RU').replace(/,/g, ' ');
function nasiyaCalc(price, down, months){
  const row = (D.nasiya || []).find(x => x.months === months); if (!row) return null;
  // 1-variant: ustama (+20$) dan oldingi asl narxdan boshlang'ich to'lov ayiriladi, qoldiqqa oylik foiz qo'yiladi,
  // keyin bir martalik ustama (+20$) qo'shiladi.  Masalan: (1809−20−800)×1.27+20 = 1276 → 6 oyga 213$
  const mk = Math.min(D.new_markup || 0, price);
  const rest = Math.max(0, price - down);
  const base = Math.max(0, price - mk - down);
  const total = base * (1 + row.pct / 100) + Math.min(mk, rest);
  return { pct: row.pct, rest, total, monthly: months ? total / months : 0, all: down + total };
}

  if (sending) return;
  const listing = { kind: 'listing', lang: LANG, src: SRC, brand: S.brand, model: S.model, memory: S.mem, color: S.color,
    region: S.region ? S.region.label : '', battery: S.batteryUnknown ? '' : (S.battery ? S.battery + '%' : ''),

    show_tg: S.L.showtg, name: S.name.trim(), phone: S.phone.trim(), est_cash: r.cash, photos: S.photos.slice(0, 3) };

    fetch(D.api.replace(/\/$/, '') + '/api/listing', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ initData: tg.initData, listing }), signal: ctl ? ctl.signal : undefined })
      .then(res => res.json().catch(() => ({})).then(j => ({ ok: res.ok && j.ok, err: j.error || res.status })))
      .then(({ ok, err }) => {
        if (ok) { haptic('success');
          const sh = openSheet(`<div style="text-align:center;padding:6px 0 2px"><div style="font-size:46px;line-height:1">📢</div>
              <h3 style="margin-top:10px">${t("E'loningiz tekshiruvga yuborildi!")}</h3>

            <div style="height:8px"></div><button class="btn ghost" id="l-again">${t("Yana e'lon berish")}</button>`);
          sh.querySelector('#l-close').onclick = () => { try { tg.close(); } catch (e) { closeSheet(); } };
          sh.querySelector('#l-again').onclick = () => { closeSheet(); restart(); };
        } else {
          haptic('error');
          toast(err === 'rate' ? t("Bugun 3 tadan ortiq e'lon berib bo'lmaydi.") : err === 'photos' ? t("Kamida 1 ta rasm qo'shing")
              : err === 'auth' ? t('Sahifa eskirib qoldi. Ilovani yopib, qayta oching.') : t("Arizani yuborib bo'lmadi. Internetni tekshirib, qayta urinib ko'ring."));
          if (btn) { btn.disabled = false; btn.textContent = t("E'lonni yuborish"); }
        } })
      .catch(() => { haptic('error'); toast(t("Arizani yuborib bo'lmadi. Internetni tekshirib, qayta urinib ko'ring."));
        const b2 = $('lsend'); if (b2) { b2.disabled = false; b2.textContent = t("E'lonni yuborish"); } })
      .finally(() => { clearTimeout(timer); sending = false; });
  };
  // natija haqida bot yozishi uchun ruxsat so'raymiz (bir marta)
  try { if (tg.requestWriteAccess && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9')) { tg.requestWriteAccess(() => go()); return; } } catch (e) {}
  go();
}

function bannerFor(place){
  const d = new Date(), today = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
  let list = (D.banners || []).filter(b => (b.place === place || b.place === 'both') && (!b.from || b.from <= today) && (!b.to || b.to >= today));
  // trade-in bonusi yo'q model uchun natijada trade-in reklamasini ko'rsatmaymiz
  if (place === 'result' && S.model && !tradeBonus()) list = list.filter(b => !/trade.?in|трейд/i.test(`${b.title} ${b.text} ${b.title_ru || ''}`));
  if (!list.length) return null;
  if (_banPick[place] == null) _banPick[place] = Math.floor(Math.random() * list.length);   // bir sessiyada bitta, navbat bilan
  return list[_banPick[place] % list.length];
}
function bannerHTML(place){
  const b = bannerFor(place); if (!b) return '';
  track('ban_view', b.id);
  const bg = b.bg ? `--bb:${b.bg}` : '';
  return `<button class="ban" data-ban="${esc(b.id)}" style="${bg}">${b.img ? `<img src="${esc(b.img)}" alt="" loading="lazy">` : ''}
    <div class="bt"><span class="ad">${t('Reklama')}</span><b>${esc(tx(b, 'title'))}</b>${b.text ? `<span class="tx">${esc(tx(b, 'text'))}</span>` : ''}
    ${b.cta && b.link ? `<span class="cta">${esc(tx(b, 'cta'))} →</span>` : ''}</div></button>`;
}

const branches = () => D.branches || [];

function openExt(url){ if (!url) return; haptic(); try { if (/^tel:/.test(url)) { location.href = url; return; } if (tg && tg.openLink) { tg.openLink(url); return; } } catch (e) {} window.open(url, '_blank', 'noopener'); }
function brOpenNow(b){ const n = new Date(), m = n.getHours() * 60 + n.getMinutes(); const p = x => { const [h, mi] = String(x).split(':').map(Number); return h * 60 + (mi || 0); };

function dayDate(i){ const d = new Date(); d.setDate(d.getDate() + i); return d; }
function slotsFor(br, day){
  const [oh] = String((br && br.open) || (branches()[0] || {}).open || '09:00').split(':').map(Number);
  const [ch] = String((br && br.close) || (branches()[0] || {}).close || '20:00').split(':').map(Number);
  const out = []; for (let h = oh; h < ch; h += 2) out.push(`${pad2(h)}:00–${pad2(Math.min(h + 2, ch))}:00`);
  if (day !== 0) return out;
  const now = new Date(), hNow = now.getHours() + now.getMinutes() / 60;
  return out.filter(x => +x.slice(6, 8) - 1 > hNow);   // bugun: kamida 1 soat qolgan oraliqlar
}
function visitHTML(){
  const bs = branches(); if (!bs.length) return '';

    ${bs.map((b, i) => `<button class="chip ${S.branch === i ? 'on' : ''}" data-br="${i}">${esc(tx(b, 'name'))}</button>`).join('')}
    <button class="chip ${S.branch === -1 ? 'on' : ''}" data-br="-1">${t("Farqi yo'q")}</button></div>
    ${curBranch() ? `<div class="brsel">📍 ${esc(tx(curBranch(), 'addr') || tx(curBranch(), 'name'))}${brMap(curBranch(), 'g') ? ` · <a href="#" data-brm="${S.branch}">${t('Xaritada')}</a>` : ''}</div>` : ''}`) + `

    <button class="chip ${S.day === -1 ? 'on' : ''}" data-day="-1">${t("Qo'ng'iroqda kelishamiz")}</button></div>`;

}

function shrinkImage(file){
  return new Promise((res, rej) => { const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { const M = 1280, k = Math.min(1, M / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.8)); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(); }; img.src = url; });
}

function getLocation(cb){
  let done = false; const fin = (l, e) => { if (!done) { done = true; cb(l, e); } };
  const viaBrowser = () => {
    if (!navigator.geolocation) return fin(null, t("Joylashuvni aniqlab bo'lmadi — manzilni yozing"));
    navigator.geolocation.getCurrentPosition(p => fin({ lat: +p.coords.latitude.toFixed(6), lon: +p.coords.longitude.toFixed(6) }),
      e => fin(null, e && e.code === 1 ? t("Joylashuvga ruxsat berilmadi — manzilni yozing") : t("Joylashuvni aniqlab bo'lmadi — manzilni yozing")),
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
  };
  const lm = tg && tg.LocationManager;
  if (lm && typeof lm.init === 'function') {
    try {
      const go = () => {
        if (!lm.isLocationAvailable) return viaBrowser();
        lm.getLocation(d => { if (d && d.latitude) fin({ lat: +(+d.latitude).toFixed(6), lon: +(+d.longitude).toFixed(6) });
          else if (lm.isAccessRequested && !lm.isAccessGranted) { try { lm.openSettings(); } catch (e) {} fin(null, t("Telegram sozlamalarida joylashuvga ruxsat bering")); }
          else viaBrowser(); });
      };
      lm.isInited ? go() : lm.init(go);
      setTimeout(() => { if (!done) viaBrowser(); }, 8000);
      return;
    } catch (e) { /* eski Telegram — brauzer usuli */ }
  }
  viaBrowser();
}

function buildAnswers(){   // xodimlar uchun — doim o'zbekcha
  const answers = D.questions.map((q, qi) => ({ q: q.title, a: (S.ans[qi] || []).map(i => q.options[i] && q.options[i].label).filter(Boolean).join(', '),
    pct: (S.ans[qi] || []).reduce((s, i) => s + ((q.options[i] || {}).pct || 0), 0) }));
  const dmgAns = (D.damage || []).map(z => { const l = z.levels[S.dmg[z.code] || 0] || {}; return { q: z.name, a: l.label || '', pct: (S.dmg[z.code] > 0 && l.pct) || 0 }; });
  return [...dmgAns, ...answers];
}
function sendLead(){
  const r = calc();
  const answers = buildAnswers();
  const payload = { lang: LANG, src: SRC, kind: 'tradein', v: 2, mode: S.mode, name: S.name.trim(), phone: S.phone.trim(),
    brand: S.brand, model: S.model, memory: S.mem, color: S.color, region: S.region ? S.region.label : '',
    battery: S.batteryUnknown ? "noma'lum" : (S.battery ? S.battery + '%' : ''), answers,
    blocked: r.blocked, cash: r.blocked ? 0 : r.cash, trade: r.blocked ? 0 : (r.tb ? r.trade : null), base: r.base,
    branch: S.pickup ? '' : (curBranch() ? curBranch().name : (S.branch === -1 ? "Farqi yo'q" : '')), visit: visitText(),
    bi: !S.pickup && curBranch() && curBranch().lat ? (b => ({ name: tx(b, 'name'), addr: tx(b, 'addr'), lat: b.lat, lon: b.lon, phone: b.phone, open: b.open, close: b.close }))(curBranch()) : null,
    pickup: !!S.pickup, address: S.pickup ? (S.addr || '').trim().slice(0, 200) : '',
    lat: S.pickup && S.loc ? S.loc.lat : null, lon: S.pickup && S.loc ? S.loc.lon : null,
    feedback: S.feedback, competitor: +String(S.competitor).replace(/\D/g, '') || 0 };
  // 1) Havola orqali ochilgan (t.me/<bot>/narx): initData bor -> arizani serverimizga yuboramiz
  if (inTelegram && tg.initData && D.api) { if (S.photos.length) payload.photos = S.photos.slice(0, 3); postLead(payload); return; }
  // 2) Botdagi pastki tugma orqali ochilgan: Telegram o'zi botga yetkazadi
  if (inTelegram && tg.sendData) {
    try { tg.sendData(JSON.stringify(payload)); haptic('success'); }
    catch (e) { haptic('error'); toast(t("Yuborish uchun botdagi pastki «📱 Telefonni narxlash» tugmasi orqali oching (/narx)")); }
  } else {
    closeSheet(); toast(t('Brauzerda ochilgan: ariza faqat Telegram ichida yuboriladi.'));
    console.log('TRADEIN', payload);
  }
}

let sending = false;
function postLead(payload){
  if (sending) return; sending = true;
  const btn = document.getElementById('l-send') || document.getElementById('l-retry');
  if (btn) { btn.disabled = true; btn.textContent = t('Yuborilmoqda…'); }
  const ctl = window.AbortController ? new AbortController() : null;
  const timer = setTimeout(() => ctl && ctl.abort(), payload.photos ? 90000 : 20000);
  fetch(D.api.replace(/\/$/, '') + '/api/lead', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ initData: tg.initData, lead: payload }), signal: ctl ? ctl.signal : undefined })
    .then(res => res.json().catch(() => ({})).then(j => ({ ok: res.ok && j.ok, err: j.error || res.status })))
    .then(({ ok, err }) => { if (ok) leadDone(); else leadFail(err); })
    .catch(() => leadFail('net'))
    .finally(() => { clearTimeout(timer); sending = false; });
}

  const bot = (D.bot || '').replace(/^@/, '');
  const sh = openSheet(`<h3>${t('Yuborilmadi')}</h3><p>${msg}</p><div style="height:14px"></div>
    <button class="btn" id="l-retry">${t('Qayta yuborish')}</button>
    ${bot ? `<div style="height:8px"></div><a class="btn ghost" style="text-decoration:none;display:block;text-align:center" href="https://t.me/${encodeURIComponent(bot)}?start=narx">${t('Bot orqali yuborish')}</a>` : ''}`);
  sh.querySelector('#l-retry').onclick = () => sendLead();
}

track('open');
loadRate();
render();
</script>
