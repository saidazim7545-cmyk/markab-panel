:root.dark{
  --brand:#E2587B;--brand-ink:#EC7C98;--brand-soft:rgba(226,88,123,.14);
  --bg:#121012;--card:#1D1A1C;--field:#262225;--text:#F1ECEE;--hint:#968D92;--line:rgba(255,255,255,.08);
  --ok:#3FBF83;--bad:#EF6B6B;--shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
button{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:5;background:var(--card);box-shadow:0 1px 0 var(--line);padding:11px 16px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:8px}
.logo .m{width:27px;height:22px;background:var(--brand);-webkit-mask:var(--mark) center/contain no-repeat;mask:var(--mark) center/contain no-repeat}
.logo .w{width:84px;height:17px;background:var(--brand);-webkit-mask:var(--word) left center/contain no-repeat;mask:var(--word) left center/contain no-repeat}
.logo small{font-size:11px;font-weight:700;color:var(--hint);text-transform:uppercase;letter-spacing:.6px;border-left:1px solid var(--line);padding-left:8px;margin-left:2px}
.lang{display:flex;background:var(--field);border-radius:9px;padding:2px}
.lang button{border:0;background:none;color:var(--hint);padding:5px 10px;font-weight:700;font-size:12px;border-radius:7px;cursor:pointer}
.lang button.on{background:var(--card);color:var(--brand);box-shadow:0 1px 2px rgba(0,0,0,.08)}
main{padding:14px 16px calc(28px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card h2{font-size:17px;margin:0 0 2px}
.card .lead{color:var(--hint);font-size:13px;margin:0}
label{display:block;font-size:12px;font-weight:700;color:var(--hint);margin:14px 0 6px}
.inp{position:relative}
.inp span{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-weight:700;color:var(--hint);font-size:17px}
.inp input{width:100%;padding:12px 12px 12px 30px;border-radius:12px;border:1px solid transparent;background:var(--field);color:var(--text);font-size:19px;font-weight:700;font-family:inherit;outline:none;-webkit-appearance:none}
.inp input:focus{border-color:var(--brand);background:var(--card)}
.inp input.bad{border-color:var(--bad)}
.err{color:var(--bad);font-size:12.5px;margin-top:6px;font-weight:600}
.quick{display:flex;gap:6px;margin-top:8px}
.quick button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 4px;font-size:13px;font-weight:600;cursor:pointer;color:var(--text)}
.quick button.on{background:var(--brand-soft);color:var(--brand);border-color:var(--brand)}
.months{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.months button{border:1px solid transparent;background:var(--field);border-radius:11px;padding:10px 0;font-size:15px;font-weight:700;cursor:pointer;min-height:44px}
.months button.on{background:var(--brand);color:var(--on-brand)}
.bonus{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;border-radius:16px;padding:14px 16px;margin-bottom:12px;color:#fff;
  background:linear-gradient(120deg,#1E8E5A 0%,#167049 100%);box-shadow:0 6px 18px rgba(30,142,90,.25)}
:root.dark .bonus{background:linear-gradient(120deg,#1C7A50,#125A3B);box-shadow:none}
.bonus::after{content:"";position:absolute;right:-30px;top:-40px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.08)}
.bonus .amt{flex:none;width:62px;height:62px;border-radius:16px;background:#fff;color:#1E8E5A;display:grid;place-items:center;font-weight:800;font-size:24px;letter-spacing:-.5px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.bonus .bt{font-weight:800;font-size:16.5px;line-height:1.25}
.bonus .bs{font-size:13px;opacity:.92;margin-top:3px;line-height:1.35}
.bonus .tag{display:inline-block;background:rgba(255,255,255,.2);border-radius:6px;padding:1px 7px;font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;margin-bottom:4px}
.hero{background:var(--brand);color:var(--on-brand);border-radius:16px;padding:16px;margin-bottom:12px}
:root.dark .hero{background:linear-gradient(135deg,#8F1B38,#6B1229)}
.hero .k{font-size:12px;font-weight:700;opacity:.85;text-transform:uppercase;letter-spacing:.5px}
.hero .v{font-size:34px;font-weight:800;letter-spacing:-.8px;margin-top:2px}
.hero .v small{font-size:15px;font-weight:600;opacity:.85}
.hero .s{font-size:13px;opacity:.9;margin-top:4px}
.rows .row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.rows .row:last-child{border-bottom:0}
.rows .row span{color:var(--hint)}
.rows .row.total{font-size:16px}
.rows .row.total span{color:var(--text);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--hint);text-align:left;font-weight:700;padding:0 0 8px}
th:last-child,td:last-child,th:nth-child(3),td:nth-child(3){text-align:right}
td{padding:9px 0;border-top:1px solid var(--line)}
td:first-child{color:var(--hint);width:36px;font-weight:700}
td b{font-weight:700}
.empty{color:var(--hint);font-size:14px;text-align:center;padding:22px 8px}
.btns{display:flex;gap:8px}
.btn{flex:1;border:0;border-radius:13px;padding:13px;font-weight:700;font-size:15px;cursor:pointer;min-height:48px}
.btn.p{background:var(--brand);color:var(--on-brand)}
.btn.s{background:var(--card);color:var(--brand);box-shadow:inset 0 0 0 1.5px var(--brand)}
.note{font-size:12px;color:var(--hint);text-align:center;margin-top:12px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;z-index:9;max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>
<header>
  <div class="logo"><div class="m"></div><div class="w"></div><small id="t-badge">Hamkor</small></div>
  <div class="lang"><button data-l="uz">UZ</button><button data-l="ru">RU</button></div>
</header>
<main id="app"></main>
<div class="toast" id="toast"></div>
<script>
const RATE = 4.5;   // oyiga ustama, %
const FEE = 30;     // bir martalik xizmat haqi, $
const tg = window.Telegram && Telegram.WebApp;
const inTg = !!(tg && (tg.initData || (tg.platform && tg.platform !== 'unknown')));
if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }
function applyTheme() {
  const dark = inTg ? tg.colorScheme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.classList.toggle('dark', dark);
  if (inTg) { try { const cs = getComputedStyle(document.documentElement);
    tg.setHeaderColor(cs.getPropertyValue('--card').trim()); tg.setBackgroundColor(cs.getPropertyValue('--bg').trim()); } catch (e) {} }
}
applyTheme();
if (inTg) tg.onEvent('themeChanged', applyTheme); else matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

const L = {
  uz: { bTag: 'Hamkorlar uchun', bTitle: "Har bir mijoz uchun $5 bonus", bSub: "Mijozni olib keling — bonusni joyida olasiz.", badge: 'Hamkor', title: 'Nasiya kalkulyatori', lead: "Mijozga oylik to'lovni tez hisoblang",
    price: 'Telefonning tan narxi', down: "Boshlang'ich to'lov", months: 'Muddat (oy)', m: 'oy',
    needPrice: 'Narxni kiriting', downBig: "Boshlang'ich to'lov narxdan kam bo'lishi kerak",
    monthly: "Oylik to'lov", forM: '{n} oy davomida', tan: 'Tan narxi', left: 'Nasiyaga qoladi',
    markup: 'Ustama ({p}% × {n} oy = {t}%)', fee: "Xizmat haqi (bir martalik)", nas: 'Nasiya summasi', all: "Mijoz jami to'laydi",
    sched: "To'lov jadvali", no: '№', date: 'Sana', pay: "To'lov", rest: 'Qoldiq',
    empty: "Narxni kiriting — jadval shu yerda chiqadi", copy: 'Nusxa olish', share: 'Mijozga yuborish',
    copied: 'Nusxa olindi', rule: "Ustama: qolgan summaga oyiga {p}% · bir martalik ${f} xizmat haqi. Oylik to'lov butun dollarga yaxlitlangan, farq oxirgi oyda. Mijozga yuboriladigan xabarda tan narxi va ustama ko'rinmaydi.",
    msgHead: 'Markab — nasiya hisob-kitobi' },
  ru: { bTag: 'Для партнёров', bTitle: 'Бонус $5 за каждого клиента', bSub: 'Приведите клиента — бонус получите сразу на месте.', badge: 'Партнёр', title: 'Калькулятор рассрочки', lead: 'Быстро посчитайте ежемесячный платёж клиенту',
    price: 'Себестоимость телефона', down: 'Первоначальный взнос', months: 'Срок (мес.)', m: 'мес.',
    needPrice: 'Введите цену', downBig: 'Взнос должен быть меньше цены',
    monthly: 'Ежемесячный платёж', forM: 'в течение {n} мес.', tan: 'Себестоимость', left: 'Остаток в рассрочку',
    markup: 'Наценка ({p}% × {n} мес. = {t}%)', fee: 'Сервисный сбор (разовый)', nas: 'Сумма рассрочки', all: 'Клиент платит всего',
    sched: 'График платежей', no: '№', date: 'Дата', pay: 'Платёж', rest: 'Остаток',
    empty: 'Введите цену — здесь появится график', copy: 'Копировать', share: 'Отправить клиенту',
    copied: 'Скопировано', rule: 'Наценка: {p}% в месяц на остаток · разовый сбор ${f}. Платёж округлён до доллара, разница — в последнем месяце. В сообщении клиенту себестоимость и наценка не указываются.',
    msgHead: 'Markab — расчёт рассрочки' }
};
let lang = 'uz';
try { const s = localStorage.getItem('mh_lang'); if (s) lang = s; else {
  const lc = tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code; if (lc === 'ru') lang = 'ru'; } } catch (e) {}
const t = (k, v = {}) => L[lang][k].replace(/\{(\w+)\}/g, (_, x) => v[x]);
const S = { price: '', down: '', months: 6 };
const $ = id => document.getElementById(id);
const usd = v => '$' + Math.round(v).toLocaleString('ru-RU').replace(/ /g, ' ');
const usd2 = v => '$' + (Math.round(v * 100) / 100).toLocaleString('ru-RU', { minimumFractionDigits: 0, maximumFractionDigits: 2 }).replace(/ /g, ' ');
const parse = s => { const n = parseFloat(String(s).replace(/\s/g, '').replace(',', '.')); return isFinite(n) && n > 0 ? n : 0; };
const haptic = () => { try { tg && tg.HapticFeedback && tg.HapticFeedback.selectionChanged(); } catch (e) {} };

function calc() {
  const price = parse(S.price), down = parse(S.down), n = S.months;
  if (!price) return { err: S.price ? 'needPrice' : null };
  if (down >= price) return { err: 'downBig' };
  const left = price - down;
  const markupPct = RATE * n;
  const markup = left * markupPct / 100;
  const nas = left + markup + FEE;                  // nasiya summasi: qoldiq + ustama + $30
  const base = Math.round(nas / n);
  const last = Math.round((nas - base * (n - 1)) * 100) / 100;
  const sched = []; let rest = nas; const d0 = new Date();
  for (let i = 1; i <= n; i++) {
    const pay = i === n ? last : base; rest = Math.max(0, Math.round((rest - pay) * 100) / 100);
    const d = new Date(d0.getFullYear(), d0.getMonth() + i, 1);
    const day = Math.min(d0.getDate(), new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate());
    sched.push({ i, date: new Date(d.getFullYear(), d.getMonth(), day), pay, rest });
  }
  return { price, down, left, markupPct, markup, nas, monthly: nas / n, base, last, all: down + nas, sched };
}
const dd = d => String(d.getDate()).padStart(2, '0') + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + d.getFullYear();

function render() {
  document.documentElement.lang = lang;
  document.title = 'Markab ' + L[lang].badge;
  $('t-badge').textContent = t('badge');
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.l === lang));
  const r = calc(), price = parse(S.price);
  const pct = price ? Math.round(parse(S.down) / price * 100) : -1;
  $('app').innerHTML = `
  <div class="bonus"><div class="amt">$5</div><div><span class="tag">${t('bTag')}</span><div class="bt">${t('bTitle')}</div><div class="bs">${t('bSub')}</div></div></div>
  <div class="card">
    <h2>${t('title')}</h2><p class="lead">${t('lead')}</p>
    <label for="price">${t('price')}</label>
    <div class="inp"><span>$</span><input id="price" class="num${r.err === 'needPrice' ? ' bad' : ''}" inputmode="decimal" autocomplete="off" placeholder="0" value="${S.price}"></div>
    <label for="down">${t('down')}</label>
    <div class="inp"><span>$</span><input id="down" class="num${r.err === 'downBig' ? ' bad' : ''}" inputmode="decimal" autocomplete="off" placeholder="0" value="${S.down}"></div>
    ${r.err === 'downBig' ? `<div class="err">${t('downBig')}</div>` : ''}
    <div class="quick">${[0, 10, 20, 30, 50].map(p => `<button data-dp="${p}" class="${pct === p ? 'on' : ''}">${p}%</button>`).join('')}</div>
    <label>${t('months')}</label>
    <div class="months">${Array.from({ length: 12 }, (_, i) => i + 1).map(m => `<button data-m="${m}" class="${S.months === m ? 'on' : ''}">${m}</button>`).join('')}</div>
  </div>
  <div id="out"></div>
  <p class="note">${t('rule', { p: String(RATE).replace('.', lang === 'ru' ? ',' : ','), f: FEE })}</p>`;
  renderOut();
  const pi = $('price'), di = $('down');
  pi.oninput = () => { S.price = clean(pi.value); renderOut(true); };
  di.oninput = () => { S.down = clean(di.value); renderOut(true); };
  document.querySelectorAll('[data-dp]').forEach(b => b.onclick = () => {
    const p = parse(S.price); if (!p) { pi.focus(); return; }
    S.down = String(Math.round(p * (+b.dataset.dp) / 100)); haptic(); render(); });
  document.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { S.months = +b.dataset.m; haptic(); render(); });
}
const clean = v => v.replace(/[^\d.,]/g, '').replace(',', '.').replace(/(\..*)\./g, '$1').slice(0, 10);

function renderOut(live) {
  const r = calc(), o = $('out');
  if (live) {   // yozayotganda faqat natija va xato belgilari yangilanadi (fokus yo'qolmasin)
    $('price').classList.toggle('bad', r.err === 'needPrice'); $('down').classList.toggle('bad', r.err === 'downBig');
    const pr = parse(S.price), pct = pr ? Math.round(parse(S.down) / pr * 100) : -1;
    document.querySelectorAll('[data-dp]').forEach(b => b.classList.toggle('on', pct === +b.dataset.dp));
    const e = document.querySelector('.err'); if (e) e.remove();
    if (r.err === 'downBig') $('down').parentNode.insertAdjacentHTML('afterend', `<div class="err">${t('downBig')}</div>`);
  }
  if (!r.sched) { o.innerHTML = `<div class="card"><div class="empty">${t('empty')}</div></div>`; return; }
  o.innerHTML = `
  <div class="hero">
    <div class="k">${t('monthly')}</div>
    <div class="v num">${usd(r.base)} <small>× ${S.months} ${t('m')}</small></div>
    <div class="s">${r.last !== r.base ? (lang === 'ru' ? 'последний месяц: ' : 'oxirgi oy: ') + usd2(r.last) + ' · ' : ''}${t('all')}: <b class="num">${usd2(r.all)}</b></div>
  </div>
  <div class="card rows">
    <div class="row"><span>${t('tan')}</span><b class="num">${usd2(r.price)}</b></div>
    <div class="row"><span>${t('down')}</span><b class="num">${usd2(r.down)}</b></div>
    <div class="row"><span>${t('left')}</span><b class="num">${usd2(r.left)}</b></div>
    <div class="row"><span>${t('markup', { p: fmtP(RATE), n: S.months, t: fmtP(r.markupPct) })}</span><b class="num">+${usd2(r.markup)}</b></div>
    <div class="row"><span>${t('fee')}</span><b class="num">+$${FEE}</b></div>
    <div class="row total"><span>${t('nas')}</span><b class="num">${usd2(r.nas)}</b></div>
  </div>
  <div class="card">
    <h2 style="margin-bottom:10px">${t('sched')}</h2>
    <table class="num"><thead><tr><th>${t('no')}</th><th>${t('date')}</th><th>${t('pay')}</th><th>${t('rest')}</th></tr></thead>
    <tbody>${r.sched.map(x => `<tr><td>${x.i}</td><td>${dd(x.date)}</td><td><b>${usd2(x.pay)}</b></td><td>${usd2(x.rest)}</td></tr>`).join('')}</tbody></table>
  </div>
  <div class="btns"><button class="btn s" id="copy">${t('copy')}</button><button class="btn p" id="share">${t('share')}</button></div>`;
  $('copy').onclick = () => copy(text(r));
  $('share').onclick = () => {
    const u = 'https://t.me/share/url?url=' + encodeURIComponent(' ') + '&text=' + encodeURIComponent(text(r));
    if (inTg && tg.openTelegramLink) tg.openTelegramLink(u); else window.open(u, '_blank');
  };
}
const fmtP = v => String(Math.round(v * 10) / 10).replace('.', ',');
function text(r) {
  const lines = [t('msgHead'), '',
    `${t('down')}: ${usd2(r.down)}`, `${t('months')}: ${S.months}`,
    `${t('monthly')}: ${usd(r.base)}${r.last !== r.base ? ' (' + (lang === 'ru' ? 'последний' : 'oxirgi') + ': ' + usd2(r.last) + ')' : ''}`,
    `${t('all')}: ${usd2(r.all)}`, '', t('sched') + ':'];
  r.sched.forEach(x => lines.push(`${x.i}. ${dd(x.date)} — ${usd2(x.pay)}`));
  return lines.join('\n');
}
function copy(s) {
  const done = () => toast(t('copied'));
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(s).then(done, () => fallback(s, done)); else fallback(s, done);
}
function fallback(s, done) { const a = document.createElement('textarea'); a.value = s; a.style.position = 'fixed'; a.style.opacity = '0';
  document.body.appendChild(a); a.select(); try { document.execCommand('copy'); done(); } catch (e) {} a.remove(); }
function toast(m) { const e = $('toast'); e.textContent = m; e.classList.add('on'); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove('on'), 1800);
  try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('success'); } catch (x) {} }
document.querySelectorAll('.lang button').forEach(b => b.onclick = () => { lang = b.dataset.l; try { localStorage.setItem('mh_lang', lang); } catch (e) {} render(); });
render();
</script>
</body>
</html>
